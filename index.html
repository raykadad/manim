<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NebulaOS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --accent:#5b8cff;
    --accent2:#c26bff;
    --glass:rgba(20,24,36,.72);
    --glass-strong:rgba(14,17,26,.88);
    --line:rgba(255,255,255,.12);
    --text:#e9edf7;
    --dim:#9aa4bd;
    --radius:14px;
    --topbar:30px;
  }
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    background:#05070d;color:var(--text);user-select:none;-webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;z-index:9000;background:radial-gradient(1200px 700px at 50% 40%,#111a2e,#04060c 70%);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s}
  #boot.done{opacity:0;pointer-events:none}
  .boot-logo{font-size:52px;font-weight:800;letter-spacing:-2px;
    background:linear-gradient(100deg,#7fb0ff,#c26bff 60%,#5ef0d0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(91,140,255,.45))}
  .boot-sub{color:var(--dim);font-size:13px;letter-spacing:3px;text-transform:uppercase}
  .boot-bar{width:280px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  #bootlog{font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#5c6a89;height:92px;width:340px;overflow:hidden;text-align:left}

  /* ---------- desktop ---------- */
  #desktop{position:fixed;inset:0;overflow:hidden}
  #wallpaper{position:absolute;inset:0;background:#0a1020 center/cover no-repeat;transition:filter .5s,transform .5s;will-change:transform}
  #wallshade{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,.35));pointer-events:none}

  /* top bar */
  #topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar);z-index:500;display:flex;align-items:center;gap:14px;
    padding:0 12px;background:rgba(8,10,16,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}
  #topbar .brand{font-weight:700;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:7px}
  #topbar .brand span.dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent)}
  #topbar .tb-item{color:var(--dim);cursor:pointer;padding:3px 7px;border-radius:6px}
  #topbar .tb-item:hover{background:rgba(255,255,255,.09);color:#fff}
  #topbar .spacer{flex:1}
  #tray{display:flex;align-items:center;gap:10px;color:var(--dim)}
  #tray .chip{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.07);cursor:pointer}
  #tray .chip:hover{background:rgba(255,255,255,.14);color:#fff}
  #tray .chip.rec{color:#ff8fa3}
  #clock{font-variant-numeric:tabular-nums;color:#dfe6f7}

  /* desktop icons */
  #icons{position:absolute;top:44px;left:12px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;max-height:calc(100% - 160px);z-index:10}
  .dicon{width:88px;height:86px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;text-align:center;padding:6px 2px}
  .dicon:hover{background:rgba(255,255,255,.1)}
  .dicon.sel{background:rgba(91,140,255,.28);outline:1px solid rgba(140,180,255,.5)}
  .dicon .gl{font-size:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .dicon .lb{font-size:11.5px;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:84px}

  /* windows */
  #windows{position:absolute;inset:0;z-index:100;pointer-events:none}
  .window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:260px;min-height:150px;
    background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.05) inset;
    animation:winIn .16s ease-out}
  @keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  .window.min{display:none}
  .window.focus{border-color:rgba(140,175,255,.35);box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(120,160,255,.18)}
  .window.max{border-radius:0}
  .titlebar{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:9px;padding:0 10px;cursor:default;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-bottom:1px solid rgba(255,255,255,.07)}
  .tl{display:flex;gap:7px;align-items:center}
  .tl b{width:12px;height:12px;border-radius:50%;display:block;cursor:pointer;border:none;padding:0}
  .tl .c{background:#ff5f57}.tl .m{background:#febc2e}.tl .z{background:#28c840}
  .tl b:hover{filter:brightness(1.25)}
  .titlebar .ttl{font-size:12.5px;font-weight:600;color:#dbe3f6;flex:1;text-align:center;pointer-events:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titlebar .ico{font-size:14px}
  .win-body{flex:1;position:relative;overflow:hidden;display:flex;background:rgba(6,8,14,.35)}
  .win-body>*{flex:1;min-width:0;min-height:0}
  .rsz{position:absolute;z-index:5}
  .rsz.e{right:0;top:0;width:6px;height:100%;cursor:ew-resize}
  .rsz.s{left:0;bottom:0;height:6px;width:100%;cursor:ns-resize}
  .rsz.se{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
  .rsz.w{left:0;top:0;width:6px;height:100%;cursor:ew-resize}
  .rsz.n{left:0;top:0;height:6px;width:100%;cursor:ns-resize}

  /* dock */
  #dock{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:400;display:flex;align-items:flex-end;gap:8px;
    padding:8px 12px;border-radius:20px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .dockitem{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;
    position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:transform .13s,background .13s}
  .dockitem:hover{transform:translateY(-9px) scale(1.12);background:rgba(255,255,255,.16)}
  .dockitem .rn{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0}
  .dockitem.running .rn{opacity:1}
  .dockitem .tip{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;padding:4px 9px;
    border-radius:7px;background:rgba(10,12,20,.95);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .12s}
  .dockitem:hover .tip{opacity:1}
  .docksep{width:1px;height:38px;background:rgba(255,255,255,.14);margin:0 3px;align-self:center}

  /* launchpad */
  #launchpad{position:absolute;inset:0;z-index:450;display:none;align-items:center;justify-content:center;
    background:rgba(6,8,14,.55);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
  #launchpad.open{display:flex;animation:fade .18s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lp-grid{display:grid;grid-template-columns:repeat(5,132px);gap:14px}
  .lp-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;cursor:pointer}
  .lp-app:hover{background:rgba(255,255,255,.12)}
  .lp-app .gl{font-size:42px}
  .lp-app .lb{font-size:12.5px;color:#dfe6f7;text-align:center}
  .lp-title{position:absolute;top:70px;left:0;right:0;text-align:center;color:var(--dim);letter-spacing:5px;font-size:12px;text-transform:uppercase}

  /* context menu + notifications + modal */
  #ctxmenu{position:absolute;z-index:800;min-width:198px;padding:6px;border-radius:11px;background:var(--glass-strong);
    border:1px solid var(--line);backdrop-filter:blur(20px);box-shadow:0 18px 44px rgba(0,0,0,.6);display:none;font-size:13px}
  #ctxmenu.open{display:block}
  #ctxmenu .mi{padding:7px 11px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
  #ctxmenu .mi:hover{background:var(--accent);color:#fff}
  #ctxmenu .sep{height:1px;background:rgba(255,255,255,.1);margin:5px 6px}
  #notifs{position:absolute;top:40px;right:12px;z-index:700;display:flex;flex-direction:column;gap:9px;width:290px;pointer-events:none}
  .notif{background:var(--glass-strong);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(16px);
    box-shadow:0 14px 32px rgba(0,0,0,.5);animation:slideIn .22s;font-size:12.5px}
  .notif b{display:block;font-size:13px;margin-bottom:2px}
  .notif span{color:var(--dim)}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

  /* generic app UI kit */
  .pane{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;font-size:13px}
  .toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08);flex:0 0 auto;flex-wrap:wrap}
  .btn{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);cursor:pointer;font-size:12.5px}
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.pri{background:linear-gradient(135deg,var(--accent),#3f6ee0);border-color:transparent;color:#fff}
  .btn.pri:hover{filter:brightness(1.12)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn.on{background:var(--accent);border-color:transparent;color:#fff}
  .fill{flex:1;overflow:auto;padding:12px}
  input[type=text],input[type=number],select,textarea{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);
    border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  label.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px;color:#cdd6ea}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.5}
  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);margin:14px 0 8px}
  h3.sec:first-child{margin-top:0}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px;margin-bottom:10px}

  /* game surfaces */
  .game{position:relative;width:100%;height:100%;background:#000;overflow:hidden}
  .game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;inset:0;pointer-events:none;font-family:ui-monospace,Menlo,Consolas,monospace}
  .hud .tl2{position:absolute;top:12px;left:14px;text-shadow:0 2px 6px #000}
  .hud .tr2{position:absolute;top:12px;right:14px;text-align:right;text-shadow:0 2px 6px #000}
  .hud .bl2{position:absolute;bottom:12px;left:14px;text-shadow:0 2px 6px #000}
  .hud .bc2{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 6px #000}
  .bar{width:150px;height:9px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#39d98a,#a7f36b);transition:width .15s}
  .bar.hp i{background:linear-gradient(90deg,#ff5b6e,#ffa26b)}
  .stars{font-size:19px;letter-spacing:2px;color:#ffd54a;text-shadow:0 0 10px rgba(255,190,40,.7)}
  .money{font-size:22px;font-weight:700;color:#8ef0a5;text-shadow:0 0 12px rgba(60,220,120,.5)}
  .mission{max-width:420px;font-size:13px;color:#fff;background:rgba(0,0,0,.42);padding:7px 12px;border-radius:9px;
    border-left:3px solid var(--accent)}
  .bigmsg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:34px;font-weight:800;
    color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.9);letter-spacing:1px;opacity:0;transition:opacity .35s}
  .bigmsg.show{opacity:1}
  .crosshair{position:absolute;top:50%;left:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
  .crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 4px #000}
  .crosshair:before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  .crosshair:after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  .startlayer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(4,6,12,.82);backdrop-filter:blur(6px);text-align:center;padding:24px;z-index:5;cursor:pointer}
  .startlayer h2{font-size:30px;letter-spacing:1px;background:linear-gradient(100deg,#7fb0ff,#c26bff);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .startlayer .keys{display:grid;grid-template-columns:auto auto;gap:5px 16px;font-size:12.5px;color:#c3cde4;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .startlayer .keys b{color:#fff;text-align:right}
  .minimap{position:absolute;right:12px;bottom:12px;width:158px;height:158px;border-radius:50%;overflow:hidden;
    border:2px solid rgba(255,255,255,.25);box-shadow:0 8px 22px rgba(0,0,0,.6);background:rgba(6,10,18,.75)}
  .minimap canvas{position:absolute;inset:0;width:100%;height:100%}

  /* chronos overlay */
  #rewindfx{position:fixed;inset:0;z-index:850;pointer-events:none;opacity:0;transition:opacity .18s;
    background:repeating-linear-gradient(0deg,rgba(120,200,255,.09) 0 2px,transparent 2px 4px);mix-blend-mode:screen}
  #rewindfx.on{opacity:1}
  #rewindfx .lbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:700 40px/1 ui-monospace,monospace;
    color:#9fe4ff;text-shadow:0 0 26px rgba(90,200,255,.9);letter-spacing:4px}
  .timeline{position:relative;height:56px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);overflow:hidden}
  .timeline .tick{position:absolute;bottom:0;width:2px;background:linear-gradient(180deg,var(--accent),rgba(91,140,255,.15));border-radius:2px}
  .timeline .cursor{position:absolute;top:0;bottom:0;width:2px;background:#ff7ad9;box-shadow:0 0 10px #ff7ad9}
  .scrub{width:100%}
  .kbd{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
    font:11px ui-monospace,monospace}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">NebulaOS</div>
  <div class="boot-sub">web-native desktop environment</div>
  <div class="boot-bar"><i id="bootbar"></i></div>
  <div id="bootlog"></div>
</div>

<div id="desktop">
  <div id="wallpaper"></div>
  <div id="wallshade"></div>
  <div id="topbar">
    <div class="brand" id="brandbtn"><span class="dot"></span>NebulaOS</div>
    <div class="tb-item" id="tbApps">Apps</div>
    <div class="tb-item" id="tbWall">Wallpaper</div>
    <div class="tb-item" id="tbChronos">Chronos</div>
    <div class="tb-item" id="tbAbout">About</div>
    <div class="spacer"></div>
    <div id="tray">
      <div class="chip rec" id="chronosChip" title="Chronos state recorder">&#9679; REC <span id="chronosCount">0</span></div>
      <div class="chip" id="fpsChip">60 fps</div>
      <div id="clock">--:--</div>
    </div>
  </div>
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="launchpad"><div class="lp-title">Launchpad</div><div class="lp-grid" id="lpgrid"></div></div>
  <div id="dock"></div>
  <div id="notifs"></div>
  <div id="ctxmenu"></div>
</div>
<div id="rewindfx"><div class="lbl" id="rewindlbl">&#9198;&#9198; REWIND</div></div>

<script>
"use strict";
/* =====================================================================
   NebulaOS  -  a single-file desktop environment for the browser
   Sections:  0 utils | 1 math | 2 webgl engine | 3 wallpaper | 4 window
              manager | 5 chronos (special feature) | 6 shell/desktop
              | 7 apps | 8 3D game: Vice Grid | 9 3D game: Neon Siege
   ===================================================================== */

/* ============================ 0. UTILITIES ========================== */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function fmtTime(ms) { const d = new Date(ms); return d.toTimeString().slice(0, 8); }

const Store = {
  get(k, d) { try { const v = localStorage.getItem('nebula:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nebula:' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('nebula:' + k); } catch (e) { } }
};

/** deterministic RNG so procedural wallpapers can be stored as a seed */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================= 1. MATH ============================== */
const M4 = {
  create() { return new Float32Array(16); },
  identity(o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  perspective(o, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    o.fill(0);
    o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf;
    return o;
  },
  lookAt(o, ex, ey, ez, cx, cy, cz, ux, uy, uz) {
    let zx = ex - cx, zy = ey - cy, zz = ez - cz;
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
    o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
    o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * ex + xy * ey + xz * ez);
    o[13] = -(yx * ex + yy * ey + yz * ez);
    o[14] = -(zx * ex + zy * ey + zz * ez);
    o[15] = 1;
    return o;
  },
  /** translation + yaw rotation + uniform-ish scale (keeps normals valid) */
  trs(o, x, y, z, yaw, s, pitch) {
    const c = Math.cos(yaw || 0), sn = Math.sin(yaw || 0);
    const sc = s == null ? 1 : s;
    const cp = Math.cos(pitch || 0), sp = Math.sin(pitch || 0);
    // R = Ry * Rx
    o[0] = c * sc; o[1] = 0; o[2] = -sn * sc; o[3] = 0;
    o[4] = sn * sp * sc; o[5] = cp * sc; o[6] = c * sp * sc; o[7] = 0;
    o[8] = sn * cp * sc; o[9] = -sp * sc; o[10] = c * cp * sc; o[11] = 0;
    o[12] = x; o[13] = y; o[14] = z; o[15] = 1;
    return o;
  }
};

/* ========================== 2. WEBGL ENGINE =========================

    else { const url = render(desc); node.style.background = '#06080f'; node.style.backgroundImage = `url(${url})`; node.style.backgroundSize = 'cover'; node.style.backgroundPosition = 'center'; }
    if (save !== false) Store.set('wallpaper', desc);
    document.dispatchEvent(new CustomEvent('wallchange'));
  }
  return {
    gens: Object.keys(GENS), apply, render,
    get() { return JSON.parse(JSON.stringify(cur)); },
    same(a, b) { return JSON.stringify(a) === JSON.stringify(b); },
    init() { apply(cur, false); }
  };
})();

/* ========================= 4. WINDOW MANAGER ======================== */
const Apps = {};
function registerApp(def) { Apps[def.id] = def; }

const WM = (() => {
  const layer = $('#windows');
  const wins = new Map();
  let zTop = 100, seq = 1, focused = null;

  function area() {
    return { x: 0, y: 30, w: window.innerWidth, h: window.innerHeight - 30 - 76 };
  }

  function launch(appId, opts) {
    const def = Apps[appId];
    if (!def) return null;
    opts = opts || {};
    if (def.single) {
      for (const w of wins.values()) if (w.appId === appId) { focus(w); if (w.min) toggleMin(w); return w; }
    }
    const id = opts.instanceId || (appId + '#' + (seq++));
    if (wins.has(id)) return wins.get(id);

    const a = area();
    const w0 = Math.min(opts.w || def.w || 640, a.w - 20), h0 = Math.min(opts.h || def.h || 440, a.h - 20);
    const node = el('div', 'window');
    node.style.width = w0 + 'px'; node.style.height = h0 + 'px';
    const off = (wins.size % 7) * 26;
    node.style.left = (opts.x != null ? opts.x : Math.round(a.x + (a.w - w0) / 2 + off - 60)) + 'px';
    node.style.top = (opts.y != null ? opts.y : Math.round(a.y + Math.max(8, (a.h - h0) / 2) + off - 40)) + 'px';

    const bar = el('div', 'titlebar');
    bar.innerHTML = `<div class="tl"><b class="c" title="close"></b><b class="m" title="minimise"></b><b class="z" title="maximise"></b></div>
      <div class="ttl"><span class="ico">${def.icon}</span> ${def.name}</div><div style="width:54px"></div>`;
    const body = el('div', 'win-body');
    node.appendChild(bar); node.appendChild(body);
    ['e', 's', 'se', 'w', 'n'].forEach(d => node.appendChild(el('div', 'rsz ' + d)));
    layer.appendChild(node);

    const win = { id, appId, def, node, body, bar, min: false, max: false, prev: null, app: null, title: def.name };
    wins.set(id, win);

    const ctx = {
      id, win,
      state: opts.state || null,
      setTitle(t) { win.title = t; $('.ttl', bar).innerHTML = `<span class="ico">${def.icon}</span> ${t}`; },
      close() { close(win); },
      notify: (t, m) => notify(t, m, def.icon),
      focus: () => focus(win)
    };
    try { win.app = def.create(ctx) || {}; } catch (e) { console.error('app failed', appId, e); win.app = { root: el('div', 'fill', '<b>App crashed.</b><pre style="color:#ff8f9c">' + String(e) + '</pre>') }; }
    if (win.app.root) body.appendChild(win.app.root);
    if (opts.state && win.app.restore) { try { win.app.restore(opts.state); } catch (e) { console.warn(e); } }

    const ro = new ResizeObserver(() => { if (win.app.onResize) win.app.onResize(body.clientWidth, body.clientHeight); });
    ro.observe(body); win.ro = ro;

    node.addEventListener('mousedown', () => focus(win), true);
    bar.addEventListener('mousedown', e => { if (e.target.tagName !== 'B') startDrag(win, e); });
    bar.addEventListener('dblclick', e => { if (e.target.tagName !== 'B') toggleMax(win); });
    $('.c', bar).onclick = () => close(win);
    $('.m', bar).onclick = () => toggleMin(win);
    $('.z', bar).onclick = () => toggleMax(win);
    node.querySelectorAll('.rsz').forEach(h => h.addEventListener('mousedown', e => startResize(win, e, h.classList[1])));

    if (opts.max) toggleMax(win);
    if (opts.min) toggleMin(win);
    focus(win);
    Dock.sync();
    Chronos.mark();
    return win;
  }

  function focus(win) {
    if (focused === win && win.node.style.zIndex) return;
    if (focused && focused !== win) { focused.node.classList.remove('focus'); if (focused.app && focused.app.onBlur) focused.app.onBlur(); }
    focused = win;
    win.node.classList.add('focus');
    win.node.style.zIndex = ++zTop;
    if (win.app && win.app.onFocus) win.app.onFocus();
  }

  function close(win) {
    if (win.app && win.app.onClose) { try { win.app.onClose(); } catch (e) { } }
    if (win.ro) win.ro.disconnect();
    win.node.style.transition = 'opacity .13s,transform .13s';
    win.node.style.opacity = '0'; win.node.style.transform = 'scale(.95)';
    setTimeout(() => win.node.remove(), 130);
    wins.delete(win.id);
    if (focused === win) focused = null;
    Dock.sync(); Chronos.mark();
  }

  function toggleMin(win) {
    win.min = !win.min;
    win.node.classList.toggle('min', win.min);
    if (win.app && win.app.onVisible) win.app.onVisible(!win.min);
    if (!win.min) focus(win);
    Dock.sync(); Chronos.mark();
  }

  function toggleMax(win, mode) {
    const a = area();
    if (win.max && !mode) {
      const p = win.prev;
      Object.assign(win.node.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px' });
      win.max = false; win.node.classList.remove('max');
    } else {
      if (!win.max) win.prev = geom(win);
      let g = { x: a.x, y: a.y, w: a.w, h: a.h };
      if (mode === 'left') g = { x: 0, y: a.y, w: Math.round(a.w / 2), h: a.h };
      if (mode === 'right') g = { x: Math.round(a.w / 2), y: a.y, w: Math.round(a.w / 2), h: a.h };
      Object.assign(win.node.style, { left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px' });
      win.max = true; win.node.classList.add('max');
    }
    Chronos.mark();
  }

  function geom(win) {
    return { x: parseInt(win.node.style.left) || 0, y: parseInt(win.node.style.top) || 0, w: win.node.offsetWidth, h: win.node.offsetHeight };
  }

  function startDrag(win, e) {
    e.preventDefault();
    const g = geom(win), sx = e.clientX, sy = e.clientY;
    const wasMax = win.max;
    let moved = false;
    function mv(ev) {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      if (wasMax && win.max) { // un-maximise and continue dragging under cursor
        win.max = false; win.node.classList.remove('max');
        const p = win.prev || { w: 640, h: 440 };
        Object.assign(win.node.style, { width: p.w + 'px', height: p.h + 'px' });
        g.x = ev.clientX - p.w / 2; g.y = Math.max(30, ev.clientY - 17);
        Object.assign(win.node.style, { left: g.x + 'px', top: g.y + 'px' });
        return;
      }
      win.node.style.left = (g.x + dx) + 'px';
      win.node.style.top = Math.max(30, g.y + dy) + 'px';
    }
    function up(ev) {
      document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
      if (moved) {
        if (ev.clientY <= 4) toggleMax(win, 'full');
        else if (ev.clientX <= 3) toggleMax(win, 'left');
        else if (ev.clientX >= window.innerWidth - 3) toggleMax(win, 'right');
      }
      Chronos.mark();
    }
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  }

  function startResize(win, e, dir) {
    e.preventDefault(); e.stopPropagation();
    const g = geom(win), sx = e.clientX, sy = e.clientY;
    function mv(ev) {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      let { x, y, w, h } = g;
      if (dir.includes('e')) w = Math.max(280, g.w + dx);
      if (dir.includes('s')) h = Math.max(160, g.h + dy);
      if (dir.includes('w')) { w = Math.max(280, g.w - dx); x = g.x + (g.w - w); }
      if (dir.includes('n')) { h = Math.max(160, g.h - dy); y = Math.max(30, g.y + (g.h - h)); }
      Object.assign(win.node.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    }
    function up() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); Chronos.mark(); }
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  }

  return {
    launch, close, focus, toggleMin, toggleMax, geom, area,
    get wins() { return wins; },
    get focused() { return focused; },
    byApp(appId) { return [...wins.values()].filter(w => w.appId === appId); },
    closeAll() { [...wins.values()].forEach(close); },
    snapshot() {
      return [...wins.values()].map(w => {
        let st = null;
        if (w.app && w.app.snapshot) { try { st = w.app.snapshot(); } catch (e) { } }
        const g = w.max && w.prev ? w.prev : geom(w);
        return { id: w.id, appId: w.appId, x: g.x, y: g.y, w: g.w, h: g.h, min: w.min, max: w.max, z: +w.node.style.zIndex || 100, state: st };
      });
    },
    restore(list) {
      const keep = new Set(list.map(s => s.id));
      [...wins.values()].forEach(w => { if (!keep.has(w.id)) close(w); });
      list.sort((a, b) => a.z - b.z).forEach(s => {
        let w = wins.get(s.id);
        if (!w) {
          w = launch(s.appId, { instanceId: s.id, x: s.x, y: s.y, w: s.w, h: s.h, state: s.state, min: s.min, max: s.max });
        } else {
          if (!w.max) Object.assign(w.node.style, { left: s.x + 'px', top: s.y + 'px', width: s.w + 'px', height: s.h + 'px' });
          if (w.max !== s.max) toggleMax(w, s.max ? 'full' : null);
          if (w.min !== s.min) toggleMin(w);
          if (s.state && w.app && w.app.restore) { try { w.app.restore(s.state); } catch (e) { console.warn(e); } }
        }
      });
      Dock.sync();
    }
  };
})();

/* ===================== 5. CHRONOS  (special feature) =================
   Chronos is an OS-wide state recorder. Every second it asks the shell
   and every running app for a small serialisable snapshot and stores it
   in a ring buffer. Because apps - including both 3D games - implement
   snapshot()/restore(), the whole desktop can be rewound: windows come
   back from the dead, a deleted note returns, and the car you just
   flipped is un-flipped. It is a system-level undo for everything.     */
const Chronos = (() => {
  const MAX = 240;            // ~4 minutes at 1 Hz
  const buf = [];
  let enabled = Store.get('chronos', true);
  let period = 1000;
  let lastCap = 0, suspended = false, dirty = false;
  const listeners = new Set();

  function sys() {
    return { wall: Wallpaper.get(), accent: document.documentElement.style.getPropertyValue('--accent') || '#5b8cff' };
  }
  function capture(reason) {
    if (!enabled || suspended) return;
    const snap = { t: Date.now(), reason: reason || 'tick', sys: sys(), wins: WM.snapshot() };
    buf.push(snap);
    while (buf.length > MAX) buf.shift();
    lastCap = performance.now();
    dirty = false;
    listeners.forEach(f => f());
  }
  function restore(snap, silent) {
    suspended = true;
    const s = snap.sys;
    if (!Wallpaper.same(s.wall, Wallpaper.get())) Wallpaper.apply(s.wall, false);
    document.documentElement.style.setProperty('--accent', s.accent);
    WM.restore(JSON.parse(JSON.stringify(snap.wins)));
    setTimeout(() => { suspended = false; capture('after-restore'); }, 120);
    if (!silent) rewindFx(snap.t);
    listeners.forEach(f => f());
  }
  function rewindFx(t) {
    const fx = $('#rewindfx'), lbl = $('#rewindlbl');
    const secs = Math.max(0, Math.round((Date.now() - t) / 1000));
    lbl.textContent = '\u25C0\u25C0 REWIND  -' + secs + 's';
    fx.classList.add('on');
    $('#desktop').style.filter = 'hue-rotate(-25deg) contrast(1.15) saturate(1.3)';
    Sfx.tone(900, .35, 'sawtooth', .1, 180);
    setTimeout(() => { fx.classList.remove('on'); $('#desktop').style.filter = ''; }, 520);
  }
  function rewindSeconds(sec) {
    if (!buf.length) return notify('Chronos', 'No snapshots recorded yet.', '\u23F1');
    const target = Date.now() - sec * 1000;
    let best = buf[0];
    for (const s of buf) if (s.t <= target) best = s;
    if (best === buf[buf.length - 1] && buf.length > 1) best = buf[buf.length - 2];
    restore(best);
    notify('Chronos', 'Rewound ' + Math.round((Date.now() - best.t) / 1000) + 's of desktop history.', '\u23F1');
  }
  function tick(now) {
    if (!enabled || suspended) return;
    if (now - lastCap >= period) capture('tick');
  }
  return {
    tick, capture, restore, rewindSeconds,
    mark() { dirty = true; if (enabled && !suspended && performance.now() - lastCap > 400) capture('event'); },
    get buffer() { return buf; },
    get enabled() { return enabled; },
    setEnabled(v) { enabled = v; Store.set('chronos', v); listeners.forEach(f => f()); },
    get period() { return period; },
    setPeriod(ms) { period = ms; },
    onChange(f) { listeners.add(f); return () => listeners.delete(f); },
    clear() { buf.length = 0; listeners.forEach(f => f()); }
  };
})();

/* ===================== 7. APPS: virtual filesystem =================== */
const FS = (() => {
  function dir(name, children) { return { type: 'dir', name, children: children || {} }; }
  function file(name, data) { return { type: 'file', name, data }; }
  function seed() {
    return dir('', {
      home: dir('home', {
        'welcome.txt': file('welcome.txt',
          'NebulaOS 1.0\n============\n\nEverything you see is one HTML file: window manager, filesystem,\nsynthesiser and two 3D games rendered with hand-written WebGL.\n\nTry:\n  * Vice Grid   - open-world driving/shooting sandbox\n  * Neon Siege  - wave-based FPS arena\n  * Chronos     - rewind the entire desktop (Ctrl+Alt+Z)\n'),
        'todo.md': file('todo.md', '# todo\n- [x] boot an OS in a browser tab\n- [x] steal a car\n- [ ] survive wave 10\n'),
        notes: dir('notes', {}),
        pictures: dir('pictures', {}),
        projects: dir('projects', { 'ideas.txt': file('ideas.txt', 'a filesystem that lives in localStorage\na time machine for windows\n') })
      }),
      sys: dir('sys', {
        'version': file('version', 'NebulaOS 1.0 "Cosmic Cassette"\nkernel: javascript/es2020\nrenderer: webgl1 (bespoke)\n'),
        'motd': file('motd', 'Be excellent to each other.\n')
      })
    });
  }
  let root = Store.get('fs', null) || seed();
  const subs = new Set();
  function save() { Store.set('fs', root); subs.forEach(f => f()); }
  function norm(path, cwd) {
    const parts = (path.startsWith('/') ? path : (cwd || '/') + '/' + path).split('/');
    const out = [];
    for (const p of parts) { if (!p || p === '.') continue; if (p === '..') out.pop(); else out.push(p); }
    return '/' + out.join('/');
  }
  function node(path) {
    const parts = path.split('/').filter(Boolean);
    let n = root;
    for (const p of parts) { if (!n || n.type !== 'dir' || !n.children[p]) return null; n = n.children[p]; }
    return n;
  }
  function parent(path) { const i = path.lastIndexOf('/'); return { dir: node(path.slice(0, i) || '/'), name: path.slice(i + 1) }; }
  return {
    node, norm, save,
    onChange(f) { subs.add(f); return () => subs.delete(f); },
    list(path) { const n = node(path); return n && n.type === 'dir' ? Object.values(n.children) : null; },
    read(path) { const n = node(path); return n && n.type === 'file' ? n.data : null; },
    write(path, data) { const { dir: d, name } = parent(path); if (!d) return false; d.children[name] = file(name, data); save(); return true; },
    mkdir(path) { const { dir: d, name } = parent(path); if (!d || d.children[name]) return false; d.children[name] = dir(name); save(); return true; },
    rm(path) { const { dir: d, name } = parent(path); if (!d || !d.children[name]) return false; delete d.children[name]; save(); return true; },
    reset() { root = seed(); save(); }
  };
})();

  create(ctx) {

    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    function print(html, cls) { const d = el('div', '', html); if (cls) d.style.color = cls; out.appendChild(d); out.scrollTop = out.scrollHeight; }
    function prompt() { ps.textContent = 'nebula:' + cwd + ' $'; }

    const CMDS = {
      help: () => print(esc(
        'commands:\n' +
        '  ls [dir]           list directory        cat <file>       print file\n' +
        '  cd <dir>           change directory      echo <t> > <f>   write file\n' +
        '  mkdir <dir>        make directory        rm <path>        delete\n' +
        '  open <app|file>    launch an app         apps             list apps\n' +
        '  wallpaper <gen>    change wallpaper      wallpapers       list generators\n' +
        '  rewind [sec]       chronos time travel   snap             force a snapshot\n' +
        '  neofetch           system info           clear            clear screen\n' +
        '  date               current time          play             fire up Vice Grid\n' +
        '  fsreset            restore demo files    exit             close shell')),
      ls: a => {
        const p = FS.norm(a[0] || '.', cwd), items = FS.list(p);
        if (!items) return print('ls: not a directory: ' + esc(p), '#ff8f9c');
        if (!items.length) return print('(empty)', '#6b7690');
        print(items.map(i => i.type === 'dir'
          ? `<span style="color:#7fb0ff">${esc(i.name)}/</span>`
          : `<span>${esc(i.name)}</span> <span style="color:#5f6b85">${(i.data || '').length}b</span>`).join('\n'));
      },
      cd: a => { const p = FS.norm(a[0] || '/home', cwd), n = FS.node(p); if (n && n.type === 'dir') { cwd = p; prompt(); } else print('cd: no such directory', '#ff8f9c'); },
      cat: a => { const d = FS.read(FS.norm(a[0] || '', cwd)); d == null ? print('cat: no such file', '#ff8f9c') : print(esc(d)); },
      mkdir: a => FS.mkdir(FS.norm(a[0] || '', cwd)) || print('mkdir: failed', '#ff8f9c'),
      rm: a => FS.rm(FS.norm(a[0] || '', cwd)) || print('rm: failed', '#ff8f9c'),
      touch: a => FS.write(FS.norm(a[0] || '', cwd), ''),
      pwd: () => print(cwd),
      clear: () => out.innerHTML = '',
      date: () => print(new Date().toString()),
      whoami: () => print('astronaut'),
      apps: () => print(Object.values(Apps).map(a => `  ${a.icon}  <b>${a.id}</b> — ${esc(a.name)}`).join('\n')),
      open: a => {
        const t = a[0];
        if (!t) return print('open: what?', '#ff8f9c');
        if (Apps[t]) { WM.launch(t); return print('launching ' + t + '...', '#6ee7a8'); }
        const p = FS.norm(t, cwd), n = FS.node(p);
        if (n && n.type === 'file') { WM.launch(/\.(png|jpg)$/.test(p) ? 'viewer' : 'notes', { state: { path: p } }); return print('opening ' + esc(p), '#6ee7a8'); }
        print('open: unknown target: ' + esc(t), '#ff8f9c');
      },
      wallpapers: () => print(Wallpaper.gens.join('  ')),
      wallpaper: a => {
        const g = a[0];
        if (!Wallpaper.gens.includes(g)) return print('usage: wallpaper <' + Wallpaper.gens.join('|') + '>', '#ff8f9c');
        Wallpaper.apply({ type: 'proc', gen: g, seed: randi(1, 9999), hue: randi(0, 359) });
        print('wallpaper set to ' + g, '#6ee7a8');
      },
      rewind: a => { Chronos.rewindSeconds(parseInt(a[0]) || 10); print('chronos: rewinding ' + (parseInt(a[0]) || 10) + 's', '#9fe4ff'); },
      snap: () => { Chronos.capture('manual'); print('snapshot captured (' + Chronos.buffer.length + ' in buffer)', '#9fe4ff'); },
      play: () => { WM.launch('gta'); print('starting Vice Grid...', '#6ee7a8'); },
      fsreset: () => { FS.reset(); print('filesystem restored to defaults', '#6ee7a8'); },
      exit: () => ctx.close(),
      neofetch: () => print(
        `<span style="color:#7fb0ff">        .:*+*:.        </span>  <b>astronaut@nebula</b>\n` +
        `<span style="color:#7fb0ff">     .*=          =*.  </span>  ----------------\n` +
        `<span style="color:#8fa4ff">    *   NebulaOS   *   </span>  OS: NebulaOS 1.0 (single file)\n` +
        `<span style="color:#a08cff">    *      1.0     *   </span>  Kernel: javascript/es2020\n` +
        `<span style="color:#b47cff">     '*=          =*'  </span>  Shell: nebula-sh\n` +
        `<span style="color:#c26bff">        ':*+*:'        </span>  WM: nebula-wm (glass)\n` +
        `                          Renderer: bespoke WebGL 1\n` +
        `                          Apps: ${Object.keys(Apps).length}   Windows: ${WM.wins.size}\n` +
        `                          Chronos: ${Chronos.buffer.length} snapshots\n` +
        `                          Resolution: ${innerWidth}x${innerHeight}`)
    };

    function run(cmdline) {
      print(`<span style="color:#6ee7a8">${esc('nebula:' + cwd + ' $')}</span> ${esc(cmdline)}`);
      const redir = cmdline.match(/^echo\s+(.*?)\s*>\s*(\S+)\s*$/);
      if (redir) { FS.write(FS.norm(redir[2], cwd), redir[1].replace(/^["']|["']$/g, '') + '\n'); return; }
      const parts = cmdline.trim().split(/\s+/), cmd = parts.shift();
      if (!cmd) return;
      if (cmd === 'echo') return print(esc(parts.join(' ')));
      if (cmd === 'sudo') return print('astronaut is not in the sudoers file. This incident has been logged.', '#ffb46b');
      const fn = CMDS[cmd];
      if (!fn) return print(`nebula-sh: command not found: ${esc(cmd)} (try 'help')`, '#ff8f9c');
      fn(parts);
    }

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const v = inp.value; inp.value = ''; if (v.trim()) { hist.push(v); hp = hist.length; } run(v); }
      else if (e.key === 'ArrowUp') { if (hp > 0) { hp--; inp.value = hist[hp] || ''; } e.preventDefault(); }
      else if (e.key === 'ArrowDown') { hp = Math.min(hist.length, hp + 1); inp.value = hist[hp] || ''; e.preventDefault(); }
      else if (e.key === 'l' && e.ctrlKey) { out.innerHTML = ''; e.preventDefault(); }
      e.stopPropagation();
    });
    root.addEventListener('mousedown', () => setTimeout(() => inp.focus(), 0));
    prompt();
    print('<b style="color:#9fb7ff">NebulaOS shell</b> — type <b>help</b> for commands.\n');
    setTimeout(() => inp.focus(), 60);

    return {
      root,
      onFocus() { inp.focus(); },
      snapshot() { return { cwd, out: out.innerHTML.slice(-20000), hist: hist.slice(-40) }; },
      restore(s) { cwd = s.cwd || '/home'; out.innerHTML = s.out || ''; prompt(); out.scrollTop = out.scrollHeight; }
    };
  }
});

registerApp({
  id: 'notes', name: 'Notes', icon: '\u{1F5D2}', w: 640, h: 460, desktop: true,
  create(ctx) {
    const root = el('div', 'pane');
    const bar = el('div', 'toolbar');
    const sel = el('select'); sel.style.minWidth = '170px';
    const nameI = el('input'); nameI.type = 'text'; nameI.style.width = '150px';
    const newB = el('button', 'btn', 'New'), saveB = el('button', 'btn pri', 'Save'), delB = el('button', 'btn', 'Delete');
    const stat = el('span', 'hint', '');
    bar.append(sel, nameI, newB, saveB, delB, stat);
    const ta = el('textarea');
    ta.style.cssText = 'flex:1;resize:none;border:none;border-radius:0;background:rgba(0,0,0,.25);padding:14px 16px;font:13.5px/1.65 ui-monospace,Menlo,Consolas,monospace';
    ta.spellcheck = false;
    root.append(bar, ta);
    const DIR = '/home/notes';
    let path = null;

    function refresh(keep) {
      const items = (FS.list(DIR) || []).filter(f => f.type === 'file');
      sel.innerHTML = '';
      items.forEach(f => { const o = el('option', '', f.name); o.value = DIR + '/' + f.name; sel.appendChild(o); });
      if (!items.length) { const o = el('option', '', '(no notes)'); o.value = ''; sel.appendChild(o); }
      if (keep) sel.value = keep;
    }
    function load(p) {
      path = p; const d = FS.read(p);
      ta.value = d == null ? '' : d;
      nameI.value = p ? p.split('/').pop() : '';
      ctx.setTitle('Notes — ' + (nameI.value || 'untitled'));
      sel.value = p || '';
    }
    function save() {
      let name = (nameI.value || '').trim() || ('note-' + Date.now() + '.txt');
      const p = path && path.split('/').pop() === name ? path : (path && path.startsWith(DIR) ? DIR + '/' + name : (path ? path.replace(/[^/]+$/, name) : DIR + '/' + name));
      FS.write(p, ta.value);
      path = p; refresh(p); load(p);
      stat.textContent = 'saved ' + new Date().toLocaleTimeString(); Sfx.click();
    }
    newB.onclick = () => { path = DIR + '/note-' + (randi(100, 999)) + '.txt'; ta.value = ''; nameI.value = path.split('/').pop(); ctx.setTitle('Notes — ' + nameI.value); };
    saveB.onclick = save;
    delB.onclick = () => { if (path && FS.rm(path)) { notify('Notes', 'Deleted ' + path.split('/').pop() + ' — Chronos can bring it back.', '\u{1F5D2}'); path = null; ta.value = ''; refresh(); } };
    sel.onchange = () => sel.value && load(sel.value);
    ta.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });

    refresh();
    if (ctx.state && ctx.state.path) load(ctx.state.path);
    else { const first = (FS.list(DIR) || [])[0]; first ? load(DIR + '/' + first.name) : newB.onclick(); }

    return {
      root,
      snapshot() { return { path, text: ta.value, name: nameI.value }; },
      restore(s) { path = s.path; ta.value = s.text || ''; nameI.value = s.name || ''; refresh(path); ctx.setTitle('Notes — ' + (s.name || 'untitled')); }
    };
  }
});

registerApp({
  id: 'files', name: 'Files', icon: '\u{1F4C1}', w: 680, h: 440, desktop: true,
  create(ctx) {
    const root = el('div', 'pane');
    const bar = el('div', 'toolbar');
    const up = el('button', 'btn sm', '\u2191 Up'), mk = el('button', 'btn sm', 'New folder'), nf = el('button', 'btn sm', 'New file');
    const crumb = el('span', 'hint', '');
    bar.append(up, mk, nf, crumb);
    const grid = el('div', 'fill');
    grid.style.cssText += 'display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;align-content:start';
    root.append(bar, grid);
    let cwd = (ctx.state && ctx.state.cwd) || '/home';

    function icon(f) {
      if (f.type === 'dir') return '\u{1F4C1}';
      if (/\.(png|jpg|jpeg)$/i.test(f.name)) return '\u{1F5BC}';
      if (/\.md$/i.test(f.name)) return '\u{1F4DD}';
      return '\u{1F4C4}';
    }
    function openFile(p, f) {
      if (/\.(png|jpg|jpeg)$/i.test(f.name)) WM.launch('viewer', { state: { path: p } });
      else WM.launch('notes', { state: { path: p } });
    }
    function draw() {
      crumb.textContent = cwd;
      ctx.setTitle('Files — ' + cwd);
      grid.innerHTML = '';
      const items = FS.list(cwd) || [];
      if (!items.length) grid.appendChild(el('div', 'hint', 'This folder is empty.'));
      items.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1)).forEach(f => {
        const p = (cwd === '/' ? '' : cwd) + '/' + f.name;
        const n = el('div', 'dicon', `<div class="gl">${icon(f)}</div><div class="lb">${f.name}</div>`);
        n.style.width = 'auto';
        n.ondblclick = () => { if (f.type === 'dir') { cwd = p; draw(); } else openFile(p, f); };
        n.oncontextmenu = e => {
          e.preventDefault(); e.stopPropagation();
          CtxMenu.open(e.clientX, e.clientY, [
            { label: 'Open', icon: '\u21AA', action: () => n.ondblclick() },
            { label: 'Rename', icon: '\u270E', action: () => { const nn = prompt('New name', f.name); if (nn) { const d = FS.node(cwd); d.children[nn] = Object.assign(f, { name: nn }); delete d.children[f.name]; FS.save(); draw(); } } },
            { label: 'Delete', icon: '\u{1F5D1}', action: () => { FS.rm(p); draw(); } },
            ...(/\.(png|jpg)$/i.test(f.name) ? [{ label: 'Set as wallpaper', icon: '\u{1F5BC}', action: () => { Wallpaper.apply({ type: 'image', data: FS.read(p) }); notify('Wallpaper', 'Applied ' + f.name, '\u{1F5BC}'); } }] : [])
          ]);
        };
        grid.appendChild(n);
      });
    }
    up.onclick = () => { cwd = FS.norm('..', cwd) || '/'; draw(); };
    mk.onclick = () => { const n = prompt('Folder name', 'new-folder'); if (n) { FS.mkdir(cwd + '/' + n); draw(); } };
    nf.onclick = () => { const n = prompt('File name', 'untitled.txt'); if (n) { FS.write(cwd + '/' + n, ''); draw(); } };
    const un = FS.onChange(draw);
    draw();
    return { root, onClose: un, snapshot() { return { cwd }; }, restore(s) { cwd = s.cwd || '/home'; draw(); } };
  }
});

registerApp({
  id: 'paint', name: 'Pixel Paint', icon: '\u{1F3A8}', w: 720, h: 520, desktop: true,
  create(ctx) {
    const root = el('div', 'pane');
    const bar = el('div', 'toolbar');
    const colors = ['#ffffff', '#000000', '#ff5f57', '#ffb02e', '#ffe66d', '#39d98a', '#5b8cff', '#c26bff', '#ff7ad9', '#7be0ff', '#8b5e3c', '#8892a6'];
    let color = '#5b8cff', size = 8, tool = 'brush';
    const sw = el('div'); sw.style.cssText = 'display:flex;gap:4px';
    colors.forEach(c => {
      const b = el('div'); b.style.cssText = `width:20px;height:20px;border-radius:5px;background:${c};cursor:pointer;border:2px solid ${c === color ? '#fff' : 'transparent'}`;
      b.onclick = () => { color = c; [...sw.children].forEach((x, i) => x.style.borderColor = colors[i] === c ? '#fff' : 'transparent'); };
      sw.appendChild(b);
    });
    const custom = el('input'); custom.type = 'color'; custom.value = color;
    custom.style.cssText = 'width:28px;height:24px;padding:0;background:none;border:none;cursor:pointer';
    custom.oninput = () => color = custom.value;
    const sizeI = el('input'); sizeI.type = 'range'; sizeI.min = 1; sizeI.max = 60; sizeI.value = size; sizeI.style.width = '90px';
    sizeI.oninput = () => size = +sizeI.value;
    const tools = {};
    const tbox = el('div'); tbox.style.cssText = 'display:flex;gap:4px';
    [['brush', '\u270F Brush'], ['line', '\u2571 Line'], ['rect', '\u25AD Rect'], ['circle', '\u25CB Circle'], ['spray', '\u2733 Spray'], ['erase', '\u25A1 Erase']].forEach(([t, lbl]) => {
      const b = el('button', 'btn sm' + (t === tool ? ' on' : ''), lbl);
      b.onclick = () => { tool = t; Object.values(tools).forEach(x => x.classList.remove('on')); b.classList.add('on'); };
      tools[t] = b; tbox.appendChild(b);
    });
    const clearB = el('button', 'btn sm', 'Clear'), saveB = el('button', 'btn sm', 'Save to Pictures'), wallB = el('button', 'btn sm pri', 'Set as wallpaper');
    bar.append(tbox, sw, custom, sizeI, clearB, saveB, wallB);

    const wrap = el('div'); wrap.style.cssText = 'flex:1;position:relative;overflow:hidden;background:#0a0d14;display:flex;align-items:center;justify-content:center';
    const cvs = el('canvas'); cvs.width = 900; cvs.height = 560;
    cvs.style.cssText = 'max-width:100%;max-height:100%;background:#12161f;cursor:crosshair;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)';
    wrap.appendChild(cvs); root.append(bar, wrap);
    const g = cvs.getContext('2d');
    g.fillStyle = '#101521'; g.fillRect(0, 0, cvs.width, cvs.height);
    g.lineCap = 'round'; g.lineJoin = 'round';

    let drawing = false, sx = 0, sy = 0, lx = 0, ly = 0, backup = null;
    const pos = e => { const r = cvs.getBoundingClientRect(); return [(e.clientX - r.left) * cvs.width / r.width, (e.clientY - r.top) * cvs.height / r.height]; };
    function stroke(x0, y0, x1, y1) {
      g.strokeStyle = tool === 'erase' ? '#101521' : color; g.lineWidth = size;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
    cvs.addEventListener('mousedown', e => {
      drawing = true;[sx, sy] = pos(e); lx = sx; ly = sy;
      backup = g.getImageData(0, 0, cvs.width, cvs.height);
      if (tool === 'brush' || tool === 'erase') stroke(sx, sy, sx + .01, sy);
    });
    window.addEventListener('mousemove', e => {
      if (!drawing) return;
      const [x, y] = pos(e);
      if (tool === 'brush' || tool === 'erase') { stroke(lx, ly, x, y); lx = x; ly = y; }
      else if (tool === 'spray') { g.fillStyle = color; for (let i = 0; i < 14; i++) { const a = Math.random() * TAU, r = Math.random() * size * 1.5; g.fillRect(x + Math.cos(a) * r, y + Math.sin(a) * r, 1.6, 1.6); } }
      else {
        g.putImageData(backup, 0, 0);
        g.strokeStyle = color; g.lineWidth = size;
        if (tool === 'line') { g.beginPath(); g.moveTo(sx, sy); g.lineTo(x, y); g.stroke(); }
        if (tool === 'rect') { g.strokeRect(Math.min(sx, x), Math.min(sy, y), Math.abs(x - sx), Math.abs(y - sy)); }
        if (tool === 'circle') { g.beginPath(); g.arc(sx, sy, Math.hypot(x - sx, y - sy), 0, TAU); g.stroke(); }
      }
    });
    window.addEventListener('mouseup', () => drawing = false);
    clearB.onclick = () => { g.fillStyle = '#101521'; g.fillRect(0, 0, cvs.width, cvs.height); };
    saveB.onclick = () => { const n = '/home/pictures/art-' + randi(100, 999) + '.png'; FS.write(n, cvs.toDataURL('image/png')); notify('Pixel Paint', 'Saved to ' + n, '\u{1F3A8}'); };
    wallB.onclick = () => { Wallpaper.apply({ type: 'image', data: cvs.toDataURL('image/png') }); notify('Pixel Paint', 'Your art is now the wallpaper.', '\u{1F3A8}'); };

    return {
      root,
      // canvases are snapshotted at low resolution to keep the ring buffer light
      snapshot() { const t = el('canvas'); t.width = 300; t.height = 187; t.getContext('2d').drawImage(cvs, 0, 0, 300, 187); return { img: t.toDataURL('image/jpeg', .6) }; },
      restore(s) { if (!s.img) return; const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, cvs.width, cvs.height); }; im.src = s.img; }
    };
  }
});

    fill.append(el('h3', 'sec', 'Desktop history'), tl, scrub, info, applyB, why);

    let idx = 0, sticky = false;

    back30.onclick = () => Chronos.rewindSeconds(30);
    clr.onclick = () => { Chronos.clear(); draw(); };

  }
});

    /* ---------------- dynamic meshes ------------------ */

    function carGeo(body, roof, police, si) {

    const CARCOLS = [[.85, .2, .22], [.15, .35, .8], [.9, .75, .2], [.9, .9, .92], [.12, .13, .16], [.2, .65, .45], [.75, .4, .12], [.6, .25, .7]];
    const carMeshes = [];

    const policeMesh = carGeo([.92, .92, .95], [.1, .1, .12], true, 0);

    /* ---------------- collision helpers --------------- */
    function pushOut(p, r) {
      let hit = false;
      for (const s of solids) {
        if (p.x < s.x0 - r || p.x > s.x1 + r || p.z < s.z0 - r || p.z > s.z1 + r) continue;
        const inside = p.x > s.x0 && p.x < s.x1 && p.z > s.z0 && p.z < s.z1;
        if (inside) {
          const dl = p.x - s.x0, dr = s.x1 - p.x, db = p.z - s.z0, df = s.z1 - p.z;
          const mn = Math.min(dl, dr, db, df);
          if (mn === dl) p.x = s.x0 - r; else if (mn === dr) p.x = s.x1 + r;
          else if (mn === db) p.z = s.z0 - r; else p.z = s.z1 + r;
          hit = true; continue;
        }
        const cx = clamp(p.x, s.x0, s.x1), cz = clamp(p.z, s.z0, s.z1);
        let dx = p.x - cx, dz = p.z - cz;
        const d = Math.hypot(dx, dz);
        if (d < r && d > 0.0001) { p.x = cx + dx / d * r; p.z = cz + dz / d * r; hit = true; }
      }
      if (p.x < MINB + 1) { p.x = MINB + 1; hit = true; }
      if (p.x > MAXB - 1) { p.x = MAXB - 1; hit = true; }
      if (p.z < MINB + 1) { p.z = MINB + 1; hit = true; }
      if (p.z > MAXB - 1) { p.z = MAXB - 1; hit = true; }
      return hit;
    }
    function blocked(x, z, r) {
      for (const s of solids) if (x > s.x0 - r && x < s.x1 + r && z > s.z0 - r && z < s.z1 + r) return true;
      return x < MINB || x > MAXB || z < MINB || z > MAXB;
    }
    function losClear(ax, az, bx, bz) {
      const d = Math.hypot(bx - ax, bz - az), steps = Math.min(40, Math.ceil(d / 3));
      for (let i = 1; i < steps; i++) { const t = i / steps; if (blocked(ax + (bx - ax) * t, az + (bz - az) * t, .3)) return false; }
      return true;
    }
    function onRoad(x, z) {
      const fx = ((x - OFF) % CELL + CELL) % CELL, fz = ((z - OFF) % CELL + CELL) % CELL;
      return fx < RW / 2 || fx > CELL - RW / 2 || fz < RW / 2 || fz > CELL - RW / 2;
    }
    function randomRoadPoint() {
      for (let i = 0; i < 60; i++) {
        const along = Math.random() < .5;
        const idx = randi(0, N), t = rand(MINB + 6, MAXB - 6);
        const x = along ? t : RC(idx) + rand(-4, 4);
        const z = along ? RC(idx) + rand(-4, 4) : t;
        if (!blocked(x, z, 1.6)) return { x, z };
      }
      return { x: 0, z: 0 };
    }

    /* ---------------- entities ------------------------ */
    const state = {

      cars: [], peds: [], parts: [], pickups: [], tracers: [],
      camYaw: 0, camPitch: -.16, camDist: 8.2, mouseIdle: 9,

      mission: { stage: 'pickup', at: randomRoadPoint(), timer: 0, reward: 0 }
    };
    function spawnCar(opts) {
      const p = opts.pos || randomRoadPoint();
      const c = {
        x: p.x, z: p.z, y: 0, yaw: opts.yaw == null ? randi(0, 3) * Math.PI / 2 : opts.yaw,
        speed: 0, ci: randi(0, carMeshes.length - 1), type: opts.type || 'civ',
        ai: opts.ai || 'parked', axis: opts.axis || (Math.random() < .5 ? 'x' : 'z'), dir: Math.random() < .5 ? 1 : -1,

      const axis = Math.random() < .5 ? 'x' : 'z', dir = Math.random() < .5 ? 1 : -1;
      const line = RC(randi(0, N)), t = rand(MINB + 10, MAXB - 10);
      const c = spawnCar({ ai: 'traffic', pos: axis === 'x' ? { x: t, z: line - dir * LANE } : { x: line + dir * LANE, z: t } });
      c.axis = axis; c.dir = dir; c.speed = rand(11, 17);
      c.yaw = axis === 'x' ? (dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (dir > 0 ? 0 : Math.PI);
    }

    }
    for (let i = 0; i < 26; i++) {
      const p = randomRoadPoint();
      state.peds.push({ x: p.x, z: p.z, yaw: rand(0, TAU), m: randi(0, PEDS.length - 1), tgt: randomRoadPoint(), speed: rand(1.3, 2.4), dead: 0, panic: 0, cop: false, hp: 30 });
    }
    for (let i = 0; i < 8; i++) { const p = randomRoadPoint(); state.pickups.push({ x: p.x, z: p.z, kind: Math.random() < .5 ? 'cash' : 'health', t: 0 }); }

    /* ---------------- input --------------------------- */
    const keys = {};
    let active = false, running = true, visible = true;
    function onKey(e) {
      if (!active) return;
      const d = e.type === 'keydown';
      keys[e.code] = d;
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyF', 'KeyR', 'KeyH', 'ShiftLeft'].includes(e.code)) e.preventDefault();
      if (d && e.code === 'KeyF') toggleCar();
      if (d && e.code === 'KeyH') { state.mission.stage = 'pickup'; state.mission.at = randomRoadPoint(); big('NEW JOB MARKED'); }
      if (d && e.code === 'KeyR') { state.player.reload = 1.1; }
    }
    function onMove(e) {
      if (!active) return;

    function onDown(e) {

    function lockChange() {

    window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKey);

    /* ---------------- gameplay helpers ---------------- */
    const bigEl = $('#g-big', hud);
    let bigT = 0;
    function big(t, ms) { bigEl.textContent = t; bigEl.classList.add('show'); bigT = (ms || 1600) / 1000; }
    function wanted(n) {
      const p = state.player;
      if (n > 0) state.heatTimer = 0;
      p.wanted = clamp(p.wanted + n, 0, 5);
      if (n > 0) { Sfx.tone(320, .12, 'square', .16); syncPolice(); }
    }
    function syncPolice() {
      const want = state.player.wanted;
      const cops = state.cars.filter(c => c.type === 'police' && !c.wreck);
      const pl = playerPos();
      for (let i = cops.length; i < want; i++) {
        let p = null;
        for (let tries = 0; tries < 24 && !p; tries++) {
          const q = randomRoadPoint(), d = Math.hypot(q.x - pl.x, q.z - pl.z);
          if (d > 45 && d < 130) p = q;               // close enough that a pursuit actually happens
        }

    }
    function playerPos() { const p = state.player; return p.inCar ? p.inCar : p; }
    function spawnParts(x, y, z, n, col, spd, life) {
      for (let i = 0; i < n; i++) state.parts.push({
        x, y, z, vx: rand(-spd, spd), vy: rand(spd * .3, spd), vz: rand(-spd, spd),
        life: life || rand(.4, 1), max: life || 1, col, s: rand(.1, .35)

    }
    function toggleCar() {
      const p = state.player;
      if (p.inCar) {
        const c = p.inCar;
        if (Math.abs(c.speed) > 14) { big('TOO FAST'); return; }
        p.x = c.x - Math.cos(c.yaw) * 2.4; p.z = c.z + Math.sin(c.yaw) * 2.4;
        pushOut(p, .5);
        p.inCar = null; c.ai = 'parked'; c.speed = 0;

        if (c.wreck) continue;

        if (d < bd) { bd = d; best = c; }
      }
      if (!best) { big('NO CAR NEARBY', 900); return; }
      if (best.ai === 'traffic' || best.type === 'police') {
        wanted(1);
        big(best.type === 'police' ? 'STOLEN A POLICE CRUISER' : 'CARJACKED', 1300);
        // eject the driver clear of the car (and briefly immune) so you do not
        // immediately run over the person you just robbed
        const side = Math.random() < .5 ? 1 : -1;
        const p2 = { x: best.x - Math.cos(best.yaw) * 3.2 * side, z: best.z + Math.sin(best.yaw) * 3.2 * side };
        state.peds.push({ x: p2.x, z: p2.z, yaw: best.yaw + Math.PI / 2, m: randi(0, PEDS.length - 1), tgt: randomRoadPoint(), speed: 3.4, dead: 0, panic: 6, cop: false, hp: 30, safe: 1.6 });

    function shoot() {
      const p = state.player;
      if (p.reload > 0) return;
      if (p.ammo <= 0) { p.reload = 1.2; Sfx.tone(150, .08, 'square', .1); return; }
      p.ammo--; p.shootCd = .18;
      Sfx.shot();
      const dir = { x: Math.sin(state.camYaw), z: Math.cos(state.camYaw) };
      const ox = p.x + dir.x * .7, oz = p.z + dir.z * .7;
      for (let i = 0; i < 10; i++) state.tracers.push({ x: ox + dir.x * i * 3, y: 1.35, z: oz + dir.z * i * 3, life: .09 });
      let hitAny = false;
      const cands = [];
      state.peds.forEach(pd => { if (!pd.dead) cands.push({ e: pd, kind: 'ped' }); });
      state.cars.forEach(c => { if (!c.wreck) cands.push({ e: c, kind: 'car' }); });
      cands.sort((a, b) => Math.hypot(a.e.x - p.x, a.e.z - p.z) - Math.hypot(b.e.x - p.x, b.e.z - p.z));
      for (const { e, kind } of cands) {
        const dx = e.x - ox, dz = e.z - oz, d = Math.hypot(dx, dz);
        if (d > 60) break;
        const along = dx * dir.x + dz * dir.z;
        if (along < 0) continue;
        const perp = Math.abs(dx * dir.z - dz * dir.x);
        if (perp > (kind === 'car' ? 1.7 : 1)) continue;
        if (!losClear(ox, oz, e.x, e.z)) continue;
        if (kind === 'ped') {
          e.hp -= 34;
          spawnParts(e.x, 1.2, e.z, 8, [.8, .1, .12], 3, .5);
          if (e.hp <= 0) { e.dead = 1; e.deadT = 0; state.player.kills++; wanted(e.cop ? 2 : 1); big(e.cop ? 'COP DOWN  +2 STARS' : 'PEDESTRIAN DOWN', 1100); }
          else { e.panic = 8; wanted(1); }
        } else {
          e.hp -= 22; spawnParts(e.x, 1, e.z, 6, [1, .8, .3], 3, .4);
          if (e.hp <= 0) wreck(e);
          else if (Math.random() < .4) e.stun = .5;
        }
        hitAny = true; break;
      }
      if (!hitAny) spawnParts(ox + dir.x * 22, .3, oz + dir.z * 22, 3, [.7, .7, .7], 1.4, .3);
      if (p.wanted === 0 && Math.random() < .8) wanted(1);
      state.peds.forEach(pd => { if (!pd.dead && Math.hypot(pd.x - p.x, pd.z - p.z) < 22) pd.panic = 7; });
    }
    function wreck(c) {
      c.wreck = true; c.hp = 0; c.speed = 0;

      const pp = playerPos();
      if (Math.hypot(pp.x - c.x, pp.z - c.z) < 7) damage(26);
      if (c === state.player.inCar) { state.player.inCar = null; state.player.x = c.x; state.player.z = c.z + 3; damage(20); }
      state.peds.forEach(pd => { if (!pd.dead && Math.hypot(pd.x - c.x, pd.z - c.z) < 6) { pd.hp -= 60; if (pd.hp <= 0) { pd.dead = 1; pd.deadT = 0; } } });
    }
    function damage(n) {
      const p = state.player;
      if (p.dead > 0) return;

    }
    function respawn(busted) {
      const p = state.player;

      p.money = Math.max(0, p.money - (busted ? 150 : 100));
      const s = randomRoadPoint(); p.x = s.x; p.z = s.z; p.dead = 0;
      state.cars = state.cars.filter(c => c.type !== 'police');
