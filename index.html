    /* ---------------- simulation ---------------------- */
    function update(dt) {
      const p = state.player;
      state.time = (state.time + dt / 210) % 1;
      state.mouseIdle += dt;
      if (bigT > 0) { bigT -= dt; if (bigT <= 0) bigEl.classList.remove('show'); }
      if (p.reload > 0) { p.reload -= dt; if (p.reload <= 0) { p.ammo = 12; Sfx.tone(700, .06, 'square', .1); } }
      if (p.dead > 0) { p.dead -= dt; if (p.dead <= 0) respawn(false); }

      const mv = { f: (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s: (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) };
      const alive = p.dead <= 0;

      /* --- player --- */
      if (p.inCar) {
        const c = p.inCar;
        drive(c, alive ? mv.f : 0, alive ? -mv.s : 0, keys.Space, dt);
        p.x = c.x; p.z = c.z;
        // run people over
        for (const pd of state.peds) {
          if (pd.dead) continue;
          if (pd.safe > 0) { pd.safe -= dt; continue; }
          if (Math.hypot(pd.x - c.x, pd.z - c.z) < 2.1 && Math.abs(c.speed) > 5) {
            pd.dead = 1; pd.deadT = 0; pd.yaw = c.yaw;
            spawnParts(pd.x, 1, pd.z, 12, [.75, .1, .12], 4, .8);
            Sfx.noise(.18, .35, 900); wanted(pd.cop ? 2 : 1); p.kills++;
            big(pd.cop ? 'OFFICER DOWN' : 'HIT AND RUN', 1200);
            c.speed *= .82;
          }
        }
      } else if (alive) {
        const sp = (keys.ShiftLeft || keys.ShiftRight ? 9.5 : 5.2);
        const fx = Math.sin(state.camYaw), fz = Math.cos(state.camYaw);
        const rx = -Math.cos(state.camYaw), rz = Math.sin(state.camYaw);
        let dx = fx * mv.f + rx * mv.s, dz = fz * mv.f + rz * mv.s;
        const l = Math.hypot(dx, dz);
        if (l > .01) {
          dx /= l; dz /= l;
          p.x += dx * sp * dt; p.z += dz * sp * dt;
          p.yaw = lerp(p.yaw, Math.atan2(dx, dz), 1 - Math.pow(.0001, dt));
          p.walk = (p.walk || 0) + dt * sp;
        }
        pushOut(p, .55);
      }

      /* --- cars --- */
      for (const c of state.cars) {
        if (c.wreck) { c.burn = (c.burn || 0) + dt; if (Math.random() < dt * 6) spawnParts(c.x, 1.2, c.z, 1, [1, .5, .1], 2, .7); continue; }
        if (c.stun > 0) { c.stun -= dt; continue; }
        if (c.ai === 'traffic') traffic(c, dt);
        else if (c.ai === 'chase') chase(c, dt);
        else if (c !== p.inCar) c.speed *= Math.pow(.02, dt);
      }
      // car <-> car shunts
      for (let i = 0; i < state.cars.length; i++) for (let j = i + 1; j < state.cars.length; j++) {
        const a = state.cars[i], b = state.cars[j];
        const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
        if (d < 3.4 && d > .001) {
          const push = (3.4 - d) / 2, nx = dx / d, nz = dz / d;
          a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
          const rel = Math.abs(a.speed - b.speed);
          if (rel > 12) {
            const dmg = rel * .7;
            a.hp -= dmg; b.hp -= dmg; a.speed *= .5; b.speed *= .5;
            spawnParts((a.x + b.x) / 2, 1, (a.z + b.z) / 2, 6, [1, .8, .4], 3, .5);
            Sfx.noise(.16, .3, 1400);
            if (a.hp <= 0) wreck(a); if (b.hp <= 0) wreck(b);
            if ((a === p.inCar || b === p.inCar)) damage(rel * .18);
          }
        }
      }
      state.cars = state.cars.filter(c => !(c.wreck && c.burn > 22));

      /* --- pedestrians --- */
      for (const pd of state.peds) {
        if (pd.dead) { pd.deadT += dt; continue; }
        if (pd.panic > 0) pd.panic -= dt;
        const tp = playerPos();
        let tx = pd.tgt.x, tz = pd.tgt.z;
        if (pd.cop && p.wanted > 0) { tx = tp.x; tz = tp.z; }
        else if (pd.panic > 0) { tx = pd.x + (pd.x - tp.x), tz = pd.z + (pd.z - tp.z); }
        const dx = tx - pd.x, dz = tz - pd.z, d = Math.hypot(dx, dz);
        if (d < 2 && !pd.cop) pd.tgt = randomRoadPoint();
        const sp = pd.speed * (pd.panic > 0 ? 2.4 : 1) * (pd.cop ? 1.7 : 1);
        if (d > .3) {
          pd.yaw = lerp(pd.yaw, Math.atan2(dx, dz), 1 - Math.pow(.002, dt));
          const nx = pd.x + Math.sin(pd.yaw) * sp * dt, nz = pd.z + Math.cos(pd.yaw) * sp * dt;
          pd.x = nx; pd.z = nz;
          if (pushOut(pd, .45) && Math.random() < .05) pd.tgt = randomRoadPoint();
          pd.walk = (pd.walk || 0) + dt * sp;
        }
        if (pd.cop && p.wanted > 0 && Math.hypot(pd.x - tp.x, pd.z - tp.z) < 2.2 && !p.inCar && p.dead <= 0) {
          p.dead = 2.4; big('BUSTED', 2400); setTimeout(() => { if (running) respawn(true); }, 1500);
        }
      }
      state.peds = state.peds.filter(pd => !(pd.dead && pd.deadT > 26));
      while (state.peds.length < 22) { const q = randomRoadPoint(); const pp = playerPos(); if (Math.hypot(q.x - pp.x, q.z - pp.z) > 40) state.peds.push({ x: q.x, z: q.z, yaw: 0, m: randi(0, PEDS.length - 1), tgt: randomRoadPoint(), speed: rand(1.3, 2.4), dead: 0, panic: 0, hp: 30 }); else break; }

      /* --- wanted level decay & cop foot patrols --- */
      const pp = playerPos();
      if (p.wanted > 0) {
        state.heatTimer += dt;
        const nearCop = state.cars.some(c => c.type === 'police' && !c.wreck && Math.hypot(c.x - pp.x, c.z - pp.z) < 40);
        if (!nearCop && state.heatTimer > 14) { p.wanted--; state.heatTimer = 0; if (p.wanted === 0) big('YOU LOST THE COPS', 1800); }
        if (p.wanted >= 3 && !state.peds.some(x => x.cop) && Math.random() < dt * .5) {
          const q = randomRoadPoint();
          if (Math.hypot(q.x - pp.x, q.z - pp.z) > 25) state.peds.push({ x: q.x, z: q.z, yaw: 0, m: 0, cop: true, tgt: { x: pp.x, z: pp.z }, speed: 2.6, dead: 0, panic: 0, hp: 60 });
        }
      }
      // police gunfire
      state.copShot -= dt;
      if (p.wanted >= 2 && state.copShot <= 0) {
        for (const c of state.cars) {
          if (c.type !== 'police' || c.wreck) continue;
          const d = Math.hypot(c.x - pp.x, c.z - pp.z);
          if (d < 26 && losClear(c.x, c.z, pp.x, pp.z)) {
            state.copShot = 1.15 - p.wanted * .1;
            Sfx.shot();
            for (let i = 0; i < 8; i++) { const t = i / 8; state.tracers.push({ x: lerp(c.x, pp.x, t), y: 1.2, z: lerp(c.z, pp.z, t), life: .08 }); }
            if (Math.random() < .5) { damage(3 + p.wanted); spawnParts(pp.x, 1.2, pp.z, 4, [.9, .2, .2], 2, .3); }
            break;
          }
        }
      }

      /* --- pickups --- */
      for (const k of state.pickups) {
        k.t += dt;
        if (k.taken) { if (k.t - k.taken > 25) { k.taken = 0; const q = randomRoadPoint(); k.x = q.x; k.z = q.z; } continue; }
        if (Math.hypot(k.x - pp.x, k.z - pp.z) < 2.4) {
          k.taken = k.t; Sfx.coin();
          if (k.kind === 'cash') { p.money += randi(40, 160); big('+ CASH', 900); }
          else { p.hp = Math.min(100, p.hp + 35); big('+ HEALTH', 900); }
        }
      }

      /* --- missions --- */
      const m = state.mission;
      const md = Math.hypot(m.at.x - pp.x, m.at.z - pp.z);
      if (m.stage === 'pickup') {
        if (md < 4.5) {
          m.stage = 'deliver'; m.at = randomRoadPoint();
          const dist = Math.hypot(m.at.x - pp.x, m.at.z - pp.z);
          m.timer = 22 + dist / 9; m.reward = Math.round(160 + dist * 2.6);
          big('PACKAGE COLLECTED'); Sfx.ok();
        }
      } else {
        m.timer -= dt;
        if (md < 5) {
          p.money += m.reward; p.delivered++;
          big('DELIVERED  +$' + m.reward, 2000); Sfx.coin();
          notify('Vice Grid', 'Delivery paid $' + m.reward + '. Total runs: ' + p.delivered, '\u{1F697}');
          m.stage = 'pickup'; m.at = randomRoadPoint(); m.timer = 0;
        } else if (m.timer <= 0) { big('DELIVERY FAILED', 1800); Sfx.err(); m.stage = 'pickup'; m.at = randomRoadPoint(); }
      }

      /* --- particles / tracers --- */
      for (const q of state.parts) {
        q.life -= dt; q.vy -= 16 * dt;
        q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
        if (q.y < .1) { q.y = .1; q.vy *= -.35; q.vx *= .6; q.vz *= .6; }
      }
      state.parts = state.parts.filter(q => q.life > 0);
      state.tracers.forEach(t => t.life -= dt);
      state.tracers = state.tracers.filter(t => t.life > 0);

      /* --- camera --- */
      const target = p.inCar ? p.inCar : p;
      if (p.inCar && state.mouseIdle > 1.4 && Math.abs(p.inCar.speed) > 3) {
        const want = p.inCar.speed >= 0 ? p.inCar.yaw : p.inCar.yaw + Math.PI;
        state.camYaw += angDiff(state.camYaw, want) * (1 - Math.pow(.06, dt));
      }
      state.camDist = lerp(state.camDist, p.inCar ? 9.4 + Math.abs(p.inCar.speed) * .09 : 6.4, 1 - Math.pow(.02, dt));
      engineSound(p.inCar);
    }

    function drive(c, throttle, steer, hand, dt) {
      const maxS = c.type === 'police' ? 40 : 36;
      const accel = throttle > 0 ? 20 : throttle < 0 ? -16 : 0;
      c.speed += accel * dt;
      if (hand) c.speed *= Math.pow(.12, dt);
      c.speed *= Math.pow(.62, dt);
      c.speed = clamp(c.speed, -14, maxS);
      const grip = clamp(Math.abs(c.speed) / 9, 0, 1);
      c.yaw += steer * grip * 1.75 * dt * (c.speed < 0 ? -1 : 1) * (hand ? 1.5 : 1);
      c.x += Math.sin(c.yaw) * c.speed * dt;
      c.z += Math.cos(c.yaw) * c.speed * dt;
      if (pushOut(c, 1.85)) {
        const impact = Math.abs(c.speed);
        if (impact > 9) {
          c.hp -= impact * .8; spawnParts(c.x, 1, c.z, 5, [1, .85, .4], 2.6, .45);
          Sfx.noise(.14, .28, 1200);
          if (c === state.player.inCar) damage(impact * .22);
          if (c.hp <= 0) wreck(c);
        }
        c.speed *= -.18;
      }
      c.roll = lerp(c.roll || 0, -steer * grip * .09, 1 - Math.pow(.01, dt));
    }
    function traffic(c, dt) {
      const iAlong = c.axis === 'x' ? c.x : c.z;
      const idx = Math.round((iAlong - OFF) / CELL);
      if (c.lastIdx == null) c.lastIdx = idx;
      if (idx !== c.lastIdx && Math.abs(iAlong - RC(idx)) < 2.4 && idx >= 0 && idx <= N) {
        c.lastIdx = idx;
        if (Math.random() < .32) {
          const nAxis = c.axis === 'x' ? 'z' : 'x';
          const nDir = Math.random() < .5 ? 1 : -1;
          if (c.axis === 'x') { c.x = RC(idx); c.z = Math.round((c.z - OFF) / CELL) * CELL + OFF; }
          else { c.z = RC(idx); c.x = Math.round((c.x - OFF) / CELL) * CELL + OFF; }
          c.axis = nAxis; c.dir = nDir;
        }
      }
      // keep to the lane
      const target = c.axis === 'x' ? RC(Math.round((c.z + c.dir * LANE - OFF) / CELL)) - c.dir * LANE
        : RC(Math.round((c.x - c.dir * LANE - OFF) / CELL)) + c.dir * LANE;
      if (c.axis === 'x') c.z = lerp(c.z, target, 1 - Math.pow(.02, dt));
      else c.x = lerp(c.x, target, 1 - Math.pow(.02, dt));
      c.yaw = c.axis === 'x' ? (c.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (c.dir > 0 ? 0 : Math.PI);
      // slow for whatever is in front
      let want = 15;
      const fx = Math.sin(c.yaw), fz = Math.cos(c.yaw);
      for (const o of state.cars) {
        if (o === c) continue;
        const dx = o.x - c.x, dz = o.z - c.z, along = dx * fx + dz * fz;
        if (along > 0 && along < 9 && Math.abs(dx * fz - dz * fx) < 2.2) want = Math.min(want, along < 5 ? 0 : 7);
      }
      const pp = playerPos();
      const dpx = pp.x - c.x, dpz = pp.z - c.z;
      if (dpx * fx + dpz * fz > 0 && dpx * fx + dpz * fz < 8 && Math.abs(dpx * fz - dpz * fx) < 2.2) want = 0;
      c.speed = lerp(c.speed, want, 1 - Math.pow(.05, dt));
      c.x += fx * c.speed * dt; c.z += fz * c.speed * dt;
      const lim = MAXB - 4;
      if (c.x > lim || c.x < MINB + 4 || c.z > lim || c.z < MINB + 4) { c.dir *= -1; c.x = clamp(c.x, MINB + 5, lim - 1); c.z = clamp(c.z, MINB + 5, lim - 1); }
    }
    /** Manhattan pursuit: cops follow the road grid instead of trying to
        drive through blocks, turning at the intersection nearest the target */
    function copWaypoint(c, pp) {
      const ixC = Math.round((c.x - OFF) / CELL), izC = Math.round((c.z - OFF) / CELL);
      const onX = Math.abs(c.z - RC(izC)) < RW / 2 + 1;
      const onZ = Math.abs(c.x - RC(ixC)) < RW / 2 + 1;
      const ixP = clamp(Math.round((pp.x - OFF) / CELL), 0, N), izP = clamp(Math.round((pp.z - OFF) / CELL), 0, N);
      if (onX && Math.abs(c.z - pp.z) > RW / 2 + 1) {
        const tx = RC(ixP);
        return Math.abs(c.x - tx) > 4 ? { x: tx, z: RC(izC) } : { x: tx, z: pp.z };
      }
      if (onZ && Math.abs(c.x - pp.x) > RW / 2 + 1) {
        const tz = RC(izP);
        return Math.abs(c.z - tz) > 4 ? { x: RC(ixC), z: tz } : { x: pp.x, z: tz };
      }
      return { x: pp.x, z: pp.z };
    }
    function chase(c, dt) {
      const pp = playerPos();
      c.siren = (c.siren || 0) + dt;
      const dist = Math.hypot(pp.x - c.x, pp.z - c.z);
      if (c.siren % 1 < dt) Sfx.tone(c.siren % 2 < 1 ? 760 : 560, .22, 'square', .045);
      if (dist < 3.4 && state.player.inCar) damage(22 * dt);

      const wp = copWaypoint(c, pp);
      let want = Math.atan2(wp.x - c.x, wp.z - c.z);
      const probe = a => {
        for (const L of [5, 9, 14]) if (blocked(c.x + Math.sin(a) * L, c.z + Math.cos(a) * L, 2.3)) return true;
        return false;
      };
      if (probe(want)) {
        for (let s = .3; s <= 2.6; s += .3) {
          if (!probe(want + s)) { want += s; break; }
          if (!probe(want - s)) { want -= s; break; }
        }
      }
      // wedged? measure real progress, not throttle: a car grinding along a
      // wall keeps flipping its speed sign but never actually goes anywhere
      c.chkT = (c.chkT || 0) + dt;
      if (c.chkT > 1.1) {
        if (c.lx != null && Math.hypot(c.x - c.lx, c.z - c.lz) < 3 && !(c.rev > 0)) {
          c.rev = 1.2; c.revDir = probe(c.yaw + 1.2) ? -1 : 1;
        }
        c.lx = c.x; c.lz = c.z; c.chkT = 0;
      }
      if (c.rev > 0) { c.rev -= dt; drive(c, -1, c.revDir, false, dt); return; }

      const turn = angDiff(c.yaw, want);
      const steerAmt = clamp(turn * 2.2, -1, 1);
      const facing = Math.abs(turn) < 1.2;
      // steering authority scales with speed, so let a crawling cruiser pivot
      if (Math.abs(c.speed) < 4) c.yaw += clamp(turn, -1.6 * dt, 1.6 * dt);
      drive(c, dist > 8 ? (facing ? 1 : .55) : (dist < 5 ? -.4 : 0), steerAmt, false, dt);
    }

    /* ---------------- audio: engine ------------------- */
    let eosc = null, egain = null;
    function engineSound(inCar) {
      try {
        if (!active || !inCar) { if (egain) egain.gain.value = 0; return; }
        const ac = Sfx.ctx();
        if (!eosc) {
          eosc = ac.createOscillator(); egain = ac.createGain();
          eosc.type = 'sawtooth'; egain.gain.value = 0;
          const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
          eosc.connect(f); f.connect(egain); egain.connect(ac.destination); eosc.start();
        }
        const sp = Math.abs(inCar.speed);
        eosc.frequency.value = 42 + sp * 4.6 + (sp % 9) * 3;
        egain.gain.value = Sfx.muted ? 0 : .015 + Math.min(sp / 40, 1) * .035;
      } catch (e) { }
    }

    /* ---------------- rendering ----------------------- */
    function skyFor(t) {
      // t: 0 = midnight, .25 = sunrise, .5 = noon, .75 = sunset
      const day = clamp(Math.sin((t - .22) * TAU) * 1.4 + .35, 0, 1);
      const dusk = clamp(1 - Math.abs(t - .77) * 9, 0, 1) + clamp(1 - Math.abs(t - .24) * 9, 0, 1);
      const night = 1 - day;
      const sky = [
        lerp(.03, .5, day) + dusk * .35,
        lerp(.04, .68, day) + dusk * .12,
        lerp(.09, .92, day)
      ];
      eng.fog = sky;
      eng.lightCol = [lerp(.2, 1.15, day) + dusk * .35, lerp(.22, 1.06, day) + dusk * .05, lerp(.34, .95, day)];
      eng.ambTop = [lerp(.08, .62, day), lerp(.1, .68, day), lerp(.18, .8, day)];
      eng.ambBot = [lerp(.04, .34, day), lerp(.045, .36, day), lerp(.08, .42, day)];
      const ang = (t - .25) * TAU;
      eng.lightDir = [Math.cos(ang) * .8, Math.max(.12, Math.sin(ang)), .35];
      eng.emisMul = .25 + night * 1.5;
      eng.fogNear = 70 + day * 60; eng.fogFar = 240 + day * 180;
      return night;
    }
    function render() {
      const p = state.player, tgt = p.inCar || p;
      const night = skyFor(state.time);
      const cy = state.camYaw, cp = state.camPitch;
      const dirx = Math.sin(cy) * Math.cos(cp), diry = Math.sin(cp), dirz = Math.cos(cy) * Math.cos(cp);
      const ty = (p.inCar ? 1.6 : 1.5), tx = tgt.x, tz = tgt.z;
      let dist = state.camDist;
      for (let s = 1; s <= 6; s++) { // pull the camera in when a wall is behind us
        const f = s / 6;
        if (blocked(tx - dirx * dist * f, tz - dirz * dist * f, .6)) { dist *= f * .85; break; }
      }
      const ex = tx - dirx * dist, ey = Math.max(1.2, ty - diry * dist + 1.7), ez = tz - dirz * dist;
      eng.begin(p.inCar ? 68 : 62, [ex, ey, ez, tx, ty + 0.5, tz]);
      eng.draw(cityMesh, 0, 0, 0, 0);

      const near = (o, r) => Math.abs(o.x - ex) < r && Math.abs(o.z - ez) < r;
      // shadows
      for (const c of state.cars) if (near(c, 150)) eng.draw(shadowMesh, c.x, .06, c.z, c.yaw, { scale: 2.3, alpha: .3, unlit: 1, tint: [0, 0, 0] });
      for (const pd of state.peds) if (near(pd, 110)) eng.draw(shadowMesh, pd.x, .05, pd.z, 0, { scale: .55, alpha: .3, unlit: 1, tint: [0, 0, 0] });
      // cars
      for (const c of state.cars) {
        if (!near(c, 200)) continue;
        const mesh = c.wreck ? wreckMesh : (c.type === 'police' ? policeMesh : carMeshes[c.ci]);
        eng.draw(mesh, c.x, c.wreck ? .05 : 0, c.z, c.yaw, { pitch: c.wreck ? .12 : (c.roll || 0) * .5 });
        if (c.type === 'police' && !c.wreck && (Math.floor((c.siren || 0) * 5) % 2 === 0))
          eng.draw(dotMesh, c.x, 2.3, c.z, 0, { scale: 1.1, unlit: 1, alpha: .55, tint: [.2, .4, 1] });
      }
      // pedestrians
      for (const pd of state.peds) {
        if (!near(pd, 140)) continue;
        const bob = pd.dead ? 0 : Math.sin((pd.walk || 0) * 3.4) * .05;
        eng.draw(pd.cop ? copMesh : PEDS[pd.m], pd.x, pd.dead ? .35 : bob, pd.z, pd.yaw, { pitch: pd.dead ? Math.PI / 2 * Math.min(1, pd.deadT * 4) : 0 });
      }
      // player on foot
      if (!p.inCar && p.dead <= 0) {
        eng.draw(shadowMesh, p.x, .05, p.z, 0, { scale: .6, alpha: .35, unlit: 1, tint: [0, 0, 0] });
        eng.draw(PEDS[0], p.x, Math.sin((p.walk || 0) * 3.4) * .06, p.z, p.yaw, { tint: [.7, .85, 1.1] });
        eng.draw(dotMesh, p.x + Math.sin(p.yaw) * .5, 1.15, p.z + Math.cos(p.yaw) * .5, p.yaw, { scale: .28, tint: [.2, .2, .22] });
      }
      // mission marker + pickups
      const m = state.mission;
      eng.draw(markerMesh, m.at.x, 0, m.at.z, 0, { alpha: .38, unlit: 1, tint: m.stage === 'pickup' ? [.3, 1, .8] : [1, .85, .2] });
      for (const k of state.pickups) {
        if (k.taken) continue;
        eng.draw(pickupMesh, k.x, 1.1 + Math.sin(k.t * 3) * .22, k.z, k.t * 1.6, { unlit: 1, tint: k.kind === 'cash' ? [.4, 1, .5] : [1, .35, .45] });
      }
      // particles / tracers
      for (const q of state.parts) eng.draw(dotMesh, q.x, q.y, q.z, 0, { scale: q.s * (q.life / q.max + .3), unlit: 1, tint: q.col });
      for (const t of state.tracers) eng.draw(dotMesh, t.x, t.y, t.z, 0, { scale: .09, unlit: 1, tint: [1, .95, .5] });
    }

    /* ---------------- minimap & hud ------------------- */
    const mg = mmc.getContext('2d');
    function minimap() {
      const p = playerPos(), S = .62, C = 95;
      mg.clearRect(0, 0, 190, 190);
      mg.fillStyle = '#0b1018'; mg.fillRect(0, 0, 190, 190);
      mg.save(); mg.translate(C, C);
      const X = x => (x - p.x) * S, Z = z => (z - p.z) * S;
      mg.strokeStyle = '#2b3446'; mg.lineWidth = RW * S;
      for (let i = 0; i <= N; i++) {
        mg.beginPath(); mg.moveTo(X(RC(i)), Z(MINB)); mg.lineTo(X(RC(i)), Z(MAXB)); mg.stroke();
        mg.beginPath(); mg.moveTo(X(MINB), Z(RC(i))); mg.lineTo(X(MAXB), Z(RC(i))); mg.stroke();
      }
      mg.fillStyle = '#171d29';
      for (const s of solids) {
        if (Math.abs((s.x0 + s.x1) / 2 - p.x) > 170 || Math.abs((s.z0 + s.z1) / 2 - p.z) > 170) continue;
        mg.fillRect(X(s.x0), Z(s.z0), (s.x1 - s.x0) * S, (s.z1 - s.z0) * S);
      }
      for (const c of state.cars) {
        if (c.wreck) continue;
        mg.fillStyle = c.type === 'police' ? '#5ab0ff' : '#8d97ad';
        mg.fillRect(X(c.x) - 2, Z(c.z) - 2, 4, 4);
      }

      const spd = 11 + (S.dash > 0 ? 34 : 0);
      S.x += dx * spd * dt; S.z += dz * spd * dt;
      if (keys.Space && S.y <= .001) { S.vy = 7.2; Sfx.tone(420, .08, 'triangle', .1); }
      S.vy -= 22 * dt; S.y += S.vy * dt;
      if (S.y < 0) { S.y = 0; S.vy = 0; }
      push(S, .8);

      /* waves */
      if (!S.enemies.length) { S.between -= dt; if (S.between <= 0) { spawnWave(); S.between = 999; } }

      /* enemies */
      for (const e of S.enemies) {
        e.hit = Math.max(0, e.hit - dt);
        e.bob += dt * 3;
        const ddx = S.x - e.x, ddz = S.z - e.z, d = Math.hypot(ddx, ddz);
        e.yaw = Math.atan2(ddx, ddz);
        const keepAway = e.kind === 'spitter' ? 15 : e.kind === 'boss' ? 6 : 2;
        if (d > keepAway) {
          const nx = ddx / d, nz = ddz / d;
          const strafe = Math.sin(e.bob * .7) * .45;
          e.x += (nx + -nz * strafe) * e.spd * dt;
          e.z += (nz + nx * strafe) * e.spd * dt;
          push(e, e.kind === 'boss' ? 2.4 : 1.1);
        }
        e.y = e.kind === 'spitter' ? 0 : .7 + Math.sin(e.bob) * .35;
        e.cd -= dt;
        if (e.kind === 'drone' || e.kind === 'boss') {
          if (d < (e.kind === 'boss' ? 7.5 : 2.6) && e.cd <= 0) { e.cd = .8; hurt(e.kind === 'boss' ? 16 : 9); parts(S.x, 1.2, S.z, 5, [1, .3, .3], 2, .3); }
        }
        if ((e.kind === 'spitter' || e.kind === 'boss') && e.cd <= 0 && d < 40) {
          e.cd = e.kind === 'boss' ? 1.1 : 2.1;
          const ey = e.y + (e.kind === 'boss' ? 2 : 1.4);
          const tx = S.x - e.x, ty = (1.4 + S.y) - ey, tz = S.z - e.z, tl = Math.hypot(tx, ty, tz);
          const spd2 = e.kind === 'boss' ? 26 : 20;
          const shots = e.kind === 'boss' ? 3 : 1;
          for (let i = 0; i < shots; i++) {
            const j = (i - (shots - 1) / 2) * .12;
            S.orbs.push({ x: e.x, y: ey, z: e.z, vx: (tx / tl + j) * spd2, vy: ty / tl * spd2, vz: (tz / tl - j * .4) * spd2, life: 3, dmg: e.kind === 'boss' ? 15 : 9 });
          }
          Sfx.tone(300, .16, 'sawtooth', .1, 120);
        }
      }
      /* enemy separation */
      for (let i = 0; i < S.enemies.length; i++) for (let j = i + 1; j < S.enemies.length; j++) {
        const a = S.enemies[i], b = S.enemies[j];
        const dx2 = b.x - a.x, dz2 = b.z - a.z, d2 = Math.hypot(dx2, dz2), min = 2.4;
        if (d2 < min && d2 > .001) { const p2 = (min - d2) / 2; a.x -= dx2 / d2 * p2; a.z -= dz2 / d2 * p2; b.x += dx2 / d2 * p2; b.z += dz2 / d2 * p2; }
      }
      /* orbs */
      for (const o of S.orbs) {
        o.life -= dt; o.x += o.vx * dt; o.y += o.vy * dt; o.z += o.vz * dt; o.vy -= 3 * dt;
        if (Math.hypot(o.x - S.x, o.y - (1.3 + S.y), o.z - S.z) < 1.1) { hurt(o.dmg); o.life = 0; parts(o.x, o.y, o.z, 6, [1, .8, .3], 3, .4); }
        if (o.y < 0 || walls.some(w => o.x > w.x0 && o.x < w.x1 && o.z > w.z0 && o.z < w.z1 && o.y < w.h)) { o.life = 0; parts(o.x, Math.max(.2, o.y), o.z, 4, [1, .7, .2], 2, .3); }
      }
      S.orbs = S.orbs.filter(o => o.life > 0);
      /* drops */
      for (const d of S.drops) {
        d.t += dt;
        if (Math.hypot(d.x - S.x, d.z - S.z) < 1.9) {
          d.gone = 1; Sfx.coin();
          if (d.kind === 'hp') { S.hp = Math.min(100, S.hp + 30); big('+30 HP', 800); }
          else { S.shield = Math.min(100, S.shield + 40); big('+40 SHIELD', 800); }
        }
      }
      S.drops = S.drops.filter(d => !d.gone && d.t < 30);
      /* particles */
      for (const q of S.parts) { q.life -= dt; q.vy -= 14 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; if (q.y < .05) { q.y = .05; q.vy *= -.3; } }
      S.parts = S.parts.filter(q => q.life > 0);
    }

    /* ---------------- render ---------------- */
    function render() {
      const eyeY = 1.65 + S.y + Math.sin(S.bob) * .05;
      const dx = Math.sin(S.yaw) * Math.cos(S.pitch), dy = Math.sin(S.pitch), dz = Math.cos(S.yaw) * Math.cos(S.pitch);
      const kick = S.kick * .02;
      eng.begin(74, [S.x, eyeY, S.z, S.x + dx, eyeY + dy + kick, S.z + dz]);
      eng.draw(arena, 0, 0, 0, 0);
      for (const e of S.enemies) {
        eng.draw(shadow, e.x, .04, e.z, 0, { scale: e.kind === 'boss' ? 2.6 : 1.1, alpha: .4, unlit: 1, tint: [0, 0, 0] });
        const m = e.kind === 'boss' ? bossMesh : e.kind === 'spitter' ? spitterMesh : droneMesh;
        const t = e.hit > 0 ? [3, 3, 3] : null;
        eng.draw(m, e.x, e.y + (e.kind === 'boss' ? 2.6 : e.kind === 'spitter' ? 1 : 1.2), e.z, e.yaw, { tint: t, pitch: e.kind === 'drone' ? Math.sin(e.bob) * .16 : 0 });
      }
      for (const o of S.orbs) eng.draw(orbMesh, o.x, o.y, o.z, 0, { unlit: 1, tint: [1, .8, .3] });
      for (const d of S.drops) eng.draw(dropMesh, d.x, 1 + Math.sin(d.t * 3) * .25, d.z, d.t * 2, { unlit: 1, tint: d.kind === 'hp' ? [.3, 1, .5] : [.35, .75, 1] });
      for (const q of S.parts) eng.draw(sparkMesh, q.x, q.y, q.z, 0, { scale: q.s * (q.life / q.max + .35), unlit: 1, tint: q.col });
      // view model
      const rx = -Math.cos(S.yaw), rz = Math.sin(S.yaw);
      const bobX = Math.sin(S.bob) * .012, bobY = Math.abs(Math.cos(S.bob)) * .012;
      const gx = S.x + dx * .62 + rx * .17 + bobX, gy = eyeY + dy * .62 - .17 - bobY - S.kick * .035, gz = S.z + dz * .62 + rz * .17;
      eng.draw(gunMesh, gx, gy, gz, S.yaw, { pitch: S.pitch, scale: .42 });
      if (S.flash > 0) eng.draw(sparkMesh, gx + dx * .45, gy + dy * .45, gz + dz * .45, 0, { scale: .22, unlit: 1, tint: [1, .85, .4], alpha: .9 });
    }

    const HH = { hp: $('#s-hp', hud), sh: $('#s-sh', hud), score: $('#s-score', hud), wave: $('#s-wave', hud), left: $('#s-left', hud), ammo: $('#s-ammo', hud), best: $('#s-best', hud) };
    let hudT = 0;
    function updHud(dt) {
      hudT -= dt; if (hudT > 0) return; hudT = .1;
      HH.hp.style.width = S.hp + '%'; HH.sh.style.width = S.shield + '%';
      HH.score.textContent = S.score.toLocaleString();
      HH.wave.textContent = 'WAVE ' + Math.max(1, S.wave);
      HH.left.textContent = S.enemies.length ? S.enemies.length + ' hostiles' : (S.between < 900 ? 'next wave in ' + Math.max(0, Math.ceil(S.between)) + 's' : '');
      HH.ammo.innerHTML = S.reload > 0 ? '<span style="color:#ffb02e">RELOADING</span>' : S.ammo + ' / ' + S.mag;
      HH.best.textContent = 'best ' + best.toLocaleString();
    }

    let last = performance.now();
    function frame(t) {
      if (!running) return;
      requestAnimationFrame(frame);
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      if (!visible) return;
      if (active) { update(dt); updHud(dt); } else { S.yaw += dt * .1; }
      render();
    }
    requestAnimationFrame(frame);

    return {
      root,
      onResize() { eng.resize(); },
      onVisible(v) { visible = v; if (!v && document.pointerLockElement === canvas) document.exitPointerLock(); },
      onClose() {
        running = false;
        window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey);
        window.removeEventListener('mouseup', up);
        document.removeEventListener('mousemove', onMove); document.removeEventListener('pointerlockchange', lockChange);
        if (document.pointerLockElement === canvas) document.exitPointerLock();
        eng.dispose();
      },
      snapshot() {
        const r = n => Math.round(n * 100) / 100;
        return {
          p: [r(S.x), r(S.y), r(S.z), r(S.yaw), r(S.pitch), S.hp, S.shield, S.ammo, S.score, S.wave],
          e: S.enemies.map(e => [r(e.x), r(e.z), Math.round(e.hp), e.kind === 'boss' ? 2 : e.kind === 'spitter' ? 1 : 0, r(e.spd), e.max]),
          b: r(S.between)
        };
      },
      restore(s) {
        if (!s || !s.p) return;
        const p = s.p;
        Object.assign(S, { x: p[0], y: p[1], z: p[2], yaw: p[3], pitch: p[4], hp: p[5], shield: p[6], ammo: p[7], score: p[8], wave: p[9], dead: 0, between: s.b, orbs: [], parts: [] });
        S.enemies = s.e.map(a => ({ x: a[0], z: a[1], y: 1, yaw: 0, hp: a[2], kind: a[3] === 2 ? 'boss' : a[3] === 1 ? 'spitter' : 'drone', spd: a[4], max: a[5], cd: 1, bob: Math.random() * TAU, hit: 0 }));
        big('TIME REWOUND', 1400);
      }
    };
  }
});
/* ====================== 10. BOOT & GLOBAL SHELL ===================== */
(function boot() {
  const accent = Store.get('accent', null);
  if (accent) document.documentElement.style.setProperty('--accent', accent);
  Wallpaper.init();
  Desktop.build(); Dock.build(); Launchpad.build();

  /* clock + fps + chronos indicator */
  const clock = $('#clock'), chip = $('#chronosCount'), fps = $('#fpsChip');
  let frames = 0, fpsT = performance.now();
  function heartbeat(t) {
    requestAnimationFrame(heartbeat);
    frames++;
    if (t - fpsT > 1000) { fps.textContent = frames + ' fps'; frames = 0; fpsT = t; }
    const d = new Date();
    clock.textContent = d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + d.toTimeString().slice(0, 5);
    Chronos.tick(t);
    chip.textContent = Chronos.buffer.length;
  }
  requestAnimationFrame(heartbeat);
  $('#chronosChip').onclick = () => WM.launch('chronos');
  $('#chronosChip').oncontextmenu = e => { e.preventDefault(); Chronos.setEnabled(!Chronos.enabled); };
  $('#fpsChip').onclick = () => WM.launch('term');

  /* top bar */
  $('#brandbtn').onclick = () => Launchpad.toggle();
  $('#tbApps').onclick = () => Launchpad.toggle();
  $('#tbWall').onclick = () => WM.launch('settings');
  $('#tbChronos').onclick = () => WM.launch('chronos');
  $('#tbAbout').onclick = () => WM.launch('about');

  function shuffleWallpaper() {
    const gens = Wallpaper.gens;
    const cur = Wallpaper.get();
    const next = gens[(gens.indexOf(cur.gen) + 1 + (Math.random() < .5 ? 0 : 1)) % gens.length];
    Wallpaper.apply({ type: 'proc', gen: next, seed: randi(1, 9999), hue: randi(0, 359) });
  }

  /* desktop context menu */
  $('#desktop').addEventListener('contextmenu', e => {
    if (e.target.closest('.window') || e.target.closest('#dock')) return;
    e.preventDefault();
    CtxMenu.open(e.clientX, e.clientY, [
      { label: 'Shuffle wallpaper', icon: '\u{1F5BC}', action: shuffleWallpaper },
      { label: 'Wallpaper settings\u2026', icon: '\u2699', action: () => WM.launch('settings') },
      '-',
      { label: 'New note', icon: '\u{1F5D2}', action: () => WM.launch('notes') },
      { label: 'Terminal here', icon: '\u{1F5A5}', action: () => WM.launch('term') },
      '-',
      { label: 'Rewind 10 seconds', icon: '\u23EA', action: () => Chronos.rewindSeconds(10) },
      { label: 'Chronos time machine', icon: '\u23F1', action: () => WM.launch('chronos') },
      '-',
      { label: 'About NebulaOS', icon: '\u{1F30C}', action: () => WM.launch('about') }
    ]);
  });
  $('#desktop').addEventListener('mousedown', e => {
    if (e.target.id === 'desktop' || e.target.id === 'wallpaper' || e.target.id === 'wallshade')
      $('#icons').querySelectorAll('.dicon').forEach(d => d.classList.remove('sel'));
  });

  /* global shortcuts (ignored while a game holds the pointer) */
  window.addEventListener('keydown', e => {
    if (document.pointerLockElement) return;
    const k = e.key.toLowerCase();
    if (e.ctrlKey && e.altKey && k === 'z') { e.preventDefault(); Chronos.rewindSeconds(10); }
    else if (e.ctrlKey && e.altKey && k === 'w') { e.preventDefault(); shuffleWallpaper(); }
    else if (e.ctrlKey && k === ' ') { e.preventDefault(); Launchpad.toggle(); }
    else if (e.ctrlKey && k === 'w') { e.preventDefault(); if (WM.focused) WM.close(WM.focused); }
    else if (k === 'escape') { Launchpad.toggle(false); CtxMenu.close(); }
  });
  window.addEventListener('resize', () => { });
  window.addEventListener('beforeunload', () => { });

  /* boot animation */
  const lines = [
    'nebula kernel 1.0 (es2020) booting\u2026',
    'mounting localStorage filesystem \u2026 ok',
    'probing webgl \u2026 ' + (document.createElement('canvas').getContext('webgl') ? 'hardware raster ok' : 'software'),
    'registering ' + Object.keys(Apps).length + ' applications',
    'compositing window manager \u2026 ok',
    'starting chronos state recorder \u2026 ok',
    'welcome, astronaut.'
  ];
  const log = $('#bootlog'), barI = $('#bootbar');
  let i = 0;
  (function step() {
    if (i < lines.length) {
      log.innerHTML += lines[i] + '<br>';
      log.scrollTop = log.scrollHeight;
      barI.style.width = Math.round((i + 1) / lines.length * 100) + '%';
      i++;
      setTimeout(step, 150 + Math.random() * 130);
    } else {
      setTimeout(() => {
        $('#boot').classList.add('done');
        setTimeout(() => $('#boot').remove(), 700);
        Chronos.capture('boot');
        notify('NebulaOS', 'Chronos is recording. Ctrl+Alt+Z rewinds the desktop.', '\u23F1');
        if (!Store.get('seen', false)) { Store.set('seen', true); WM.launch('about'); }
      }, 380);
    }
  })();
})();
</script>
