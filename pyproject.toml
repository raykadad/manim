[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-style-kit"
version = "0.1.0"
description = "Reusable Manim style kit for polished AI, math, science, and algorithm explainer videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["manim_style_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
