<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DatImpulse — Residential Proxy Pipeline (45s Visualizer)</title>
<!--
  1920x1080 CSS-animated SVG on a 45 second loop. No JavaScript is used or
  needed: every scene change, reveal and caption swap is a keyframe on the same
  master clock (--T).

    0:00 – 0:10  agent hits rate limits, terminal fills with 429 / IP BLOCKED
    0:10 – 0:25  wireframe globe, live routing, 90M+ IPs / 195 countries
    0:25 – 0:35  dataimpulseclip.mp4 in a browser frame + pay-as-you-go pricing
    0:35 – 0:45  deep blue call to action

  Drop dataimpulseclip.mp4 next to this file. If the clip is missing, the vector
  dashboard drawn underneath it shows through instead.
-->

<style>
/* ==========================================================================
   MASTER CLOCK
   Every timed animation runs for exactly --T (45s) and loops forever, so all
   scenes, cues and captions stay locked to the same timeline.

   0:00 – 0:10  STATE 1  blocked agent / terminal errors
   0:10 – 0:25  STATE 2  global residential network
   0:25 – 0:35  STATE 3  dashboard video + pricing
   0:35 – 0:45  STATE 4  call to action
   ========================================================================== */
:root{
  --T: 45s;

  --bg:        #0b0e14;
  --bg-deep:   #05070b;
  --panel:     #11161f;
  --panel-2:   #0c1017;
  --line:      #1e2735;
  --line-hi:   #2b3a4d;
  --ink:       #d7e0ea;
  --ink-dim:   #6b7889;
  --ink-faint: #46505f;

  --green:  #2bff88;
  --green-2:#12c46a;
  --cyan:   #35d6ff;
  --red:    #ff3b5c;
  --red-2:  #ff7a8c;
  --amber:  #ffb347;
  --violet: #9d7bff;

  --mono: "JetBrains Mono", "Fira Code", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
}

html,body{height:100%;}
body{
  margin:0;
  background:#04060a;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.frame{
  width:min(100vw, 177.7777vh);
  aspect-ratio:16 / 9;
  box-shadow:0 0 120px rgba(0,0,0,.9);
}
/* font-family and fill live on the root so that a colour class on any <g>
   still cascades down to the <text> nodes inside it */
svg.stage{display:block;width:100%;height:100%;font-family:var(--mono);fill:var(--ink);}

/* ==========================================================================
   TYPE
   ========================================================================== */
.sans{font-family:var(--sans);}
.dim{fill:var(--ink-dim);}
.faint{fill:var(--ink-faint);}
.green{fill:var(--green);}
.cyan{fill:var(--cyan);}
.red{fill:var(--red);}
.amber{fill:var(--amber);}
.b{font-weight:700;}
.track{letter-spacing:.22em;}
.glow-g{filter:drop-shadow(0 0 10px rgba(43,255,136,.55));}
.glow-c{filter:drop-shadow(0 0 10px rgba(53,214,255,.5));}
.glow-r{filter:drop-shadow(0 0 12px rgba(255,59,92,.6));}

/* ==========================================================================
   SCENE VISIBILITY — hard-timed crossfades on the master clock
   ========================================================================== */
.scene{animation-duration:var(--T);animation-timing-function:linear;animation-iteration-count:infinite;}
.s1{animation-name:stateA;}
.s2{animation-name:stateB;opacity:0;}
.s3{animation-name:stateC;opacity:0;}
.s4{animation-name:stateD;opacity:0;}

@keyframes stateA{                       /* 0:00 → 0:10 */
  0%,21.55%   {opacity:1;}
  22.22%,98.6%{opacity:0;}
  100%        {opacity:1;}
}
@keyframes stateB{                       /* 0:10 → 0:25 */
  0%,22.22%   {opacity:0;}
  23.11%,54.9%{opacity:1;}
  55.56%,100% {opacity:0;}
}
@keyframes stateC{                       /* 0:25 → 0:35 */
  0%,55.56%    {opacity:0;}
  56.44%,77.11%{opacity:1;}
  77.78%,100%  {opacity:0;}
}
@keyframes stateD{                       /* 0:35 → 0:45 */
  0%,77.78%    {opacity:0;}
  78.67%,98.6% {opacity:1;}
  100%         {opacity:0;}
}

/* ==========================================================================
   CUE SYSTEM
   An element carries style="--at:6.4s" = the second on the 45s timeline where
   its entrance fires. One keyframe set plus a per-element negative delay keeps
   every reveal on the same loop with no JavaScript scheduling.

   A cue stays lit for 20s (44.44% of the loop) and then drops. That window is
   always long enough to reach the end of its own state and always short enough
   to have cleared before that state comes round again, so the loop is seamless.
   The scene gate above hides the tail of the window.
   ========================================================================== */
.cue{
  --at:0s;
  animation-duration:var(--T);
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  animation-delay:calc(var(--at) - var(--T));
  opacity:0;
}
.cue-in  {animation-name:cueIn;}
.cue-left{animation-name:cueLeft;}
.cue-up  {animation-name:cueUp;}
.cue-pop {animation-name:cuePop;transform-box:fill-box;transform-origin:center;}
.cue-tick{animation-name:cueTick;}
.cue-hold1s{animation-name:cueHold1s;}
.cue-flick{animation-name:cueFlick;}

@keyframes cueIn{
  0%     {opacity:0;}
  1%     {opacity:1;}
  44.44% {opacity:1;}
  44.5%  {opacity:0;}
  100%   {opacity:0;}
}
@keyframes cueLeft{
  0%     {opacity:0;transform:translateX(-14px);}
  1.1%   {opacity:1;transform:translateX(0);}
  44.44% {opacity:1;transform:translateX(0);}
  44.5%  {opacity:0;transform:translateX(0);}
  100%   {opacity:0;transform:translateX(0);}
}
@keyframes cueUp{
  0%     {opacity:0;transform:translateY(16px);}
  1.4%   {opacity:1;transform:translateY(0);}
  44.44% {opacity:1;transform:translateY(0);}
  44.5%  {opacity:0;transform:translateY(0);}
  100%   {opacity:0;transform:translateY(0);}
}
@keyframes cuePop{
  0%     {opacity:0;transform:scale(.86);}
  .8%    {opacity:1;transform:scale(1.06);}
  1.6%   {opacity:1;transform:scale(1);}
  44.44% {opacity:1;transform:scale(1);}
  44.5%  {opacity:0;transform:scale(1);}
  100%   {opacity:0;transform:scale(1);}
}
/* one-second window — running timecode */
@keyframes cueTick{
  0%    {opacity:1;}
  2.18% {opacity:1;}
  2.22% {opacity:0;}
  100%  {opacity:0;}
}
/* one-second window — counters that step once per second */
@keyframes cueHold1s{
  0%    {opacity:0;}
  .1%   {opacity:1;}
  2.18% {opacity:1;}
  2.22% {opacity:0;}
  100%  {opacity:0;}
}
/* 0.35s window — fast count-up digits */
@keyframes cueFlick{
  0%   {opacity:0;}
  .05% {opacity:1;}
  .74% {opacity:1;}
  .78% {opacity:0;}
  100% {opacity:0;}
}

/* ==========================================================================
   AMBIENT LOOPS (decorative, independent of the scene clock)
   ========================================================================== */
@keyframes blink   {0%,49%{opacity:1;}50%,100%{opacity:0;}}
@keyframes softPulse{0%,100%{opacity:.35;}50%{opacity:1;}}
@keyframes ringOut {0%{transform:scale(.6);opacity:.9;}100%{transform:scale(2.4);opacity:0;}}
@keyframes dash    {to{stroke-dashoffset:-400;}}
@keyframes drift   {0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes scan    {0%{transform:translateY(0);}100%{transform:translateY(552px);}}

.caret{animation:blink 1s steps(1) infinite;}
.pulse{animation:softPulse 1.8s ease-in-out infinite;}
.node-ring{transform-box:fill-box;transform-origin:center;animation:ringOut 2.6s ease-out infinite;}

/* ==========================================================================
   HUD / TIMELINE
   ========================================================================== */
.hud-rule{stroke:var(--line);stroke-width:1;}
.tl-seg{opacity:.18;}
.tl-live{animation-duration:var(--T);animation-timing-function:linear;animation-iteration-count:infinite;opacity:0;}
.tl-a{animation-name:stateA;opacity:1;}
.tl-b{animation-name:stateB;}
.tl-c{animation-name:stateC;}
.tl-d{animation-name:stateD;}
.playhead{animation:playhead var(--T) linear infinite;}
@keyframes playhead{from{transform:translateX(0);}to{transform:translateX(1600px);}}
.tc{font-size:24px;fill:var(--ink-dim);}

/* ==========================================================================
   STATE 1 — BLOCKED
   ========================================================================== */
.term-line{font-size:24px;}
.alarm{animation:alarm var(--T) linear infinite;opacity:0;}
@keyframes alarm{
  0%,6.3%   {opacity:0;}
  6.5%      {opacity:.55;}
  7.4%      {opacity:0;}
  8.78%     {opacity:0;}
  8.95%     {opacity:.55;}
  9.9%      {opacity:0;}
  11.24%    {opacity:0;}
  11.4%     {opacity:.6;}
  12.3%     {opacity:0;}
  13.68%    {opacity:0;}
  13.85%    {opacity:.6;}
  14.8%     {opacity:0;}
  16.1%     {opacity:0;}
  16.3%     {opacity:.6;}
  17.2%     {opacity:0;}
  18.55%    {opacity:0;}
  18.75%    {opacity:.7;}
  19.9%     {opacity:0;}
  100%      {opacity:0;}
}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp var(--T) linear infinite;opacity:0;}
@keyframes stamp{
  0%,11.1%    {opacity:0;transform:scale(1.25) rotate(-9deg);}
  11.5%       {opacity:1;transform:scale(1) rotate(-9deg);}
  12.4%       {opacity:.55;transform:scale(1) rotate(-9deg);}
  13.3%       {opacity:1;transform:scale(1) rotate(-9deg);}
  14.2%       {opacity:.55;transform:scale(1) rotate(-9deg);}
  15.1%       {opacity:1;transform:scale(1) rotate(-9deg);}
  19.9%       {opacity:1;transform:scale(1) rotate(-9deg);}
  20.6%,100%  {opacity:0;transform:scale(1) rotate(-9deg);}
}
.meter-fail{transform-box:fill-box;transform-origin:left center;animation:meterFail var(--T) linear infinite;}
@keyframes meterFail{
  0%      {transform:scaleX(0);}
  2.2%    {transform:scaleX(.12);}
  5.5%    {transform:scaleX(.48);}
  9%      {transform:scaleX(.79);}
  13%     {transform:scaleX(.94);}
  18%,100%{transform:scaleX(1);}
}

/* ==========================================================================
   STATE 2 — GLOBAL NETWORK
   ========================================================================== */
.meridian{
  fill:none;stroke:#1d3f52;stroke-width:1.4;
  transform-box:fill-box;transform-origin:center;
  animation:spin 16s ease-in-out infinite;
}
@keyframes spin{
  0%  {transform:scaleX(1);}
  25% {transform:scaleX(.02);}
  50% {transform:scaleX(-1);}
  75% {transform:scaleX(.02);}
  100%{transform:scaleX(1);}
}
.parallel{fill:none;stroke:#173444;stroke-width:1.2;}
.arc{
  fill:none;stroke:var(--cyan);stroke-width:2;opacity:.5;
  stroke-dasharray:10 14;animation:dash 3.2s linear infinite;
}
.packet{
  fill:var(--green);
  transform-box:fill-box;transform-origin:50% 50%;
  filter:drop-shadow(0 0 8px rgba(43,255,136,.95));
  animation-name:flow;animation-timing-function:linear;animation-iteration-count:infinite;
}
@keyframes flow{
  0%  {offset-distance:0%;opacity:0;}
  6%  {opacity:1;}
  92% {opacity:1;}
  100%{offset-distance:100%;opacity:0;}
}
.p1{offset-path:path("M 470 322 Q 620 150 780 392");animation-duration:2.6s;}
.p2{offset-path:path("M 780 392 Q 786 640 566 566");animation-duration:3.1s;animation-delay:-1.2s;}
.p3{offset-path:path("M 566 566 Q 350 560 428 430");animation-duration:2.9s;animation-delay:-.6s;}
.p4{offset-path:path("M 428 430 Q 430 250 470 322");animation-duration:2.2s;animation-delay:-1.7s;}
.p5{offset-path:path("M 640 262 Q 830 300 780 392");animation-duration:2.4s;animation-delay:-.9s;}
.u1{offset-path:path("M 806 372 C 960 300 1010 288 1128 288");animation-duration:2.1s;}
.u2{offset-path:path("M 830 470 C 980 470 1020 470 1128 470");animation-duration:2.4s;animation-delay:-1.1s;}
.u3{offset-path:path("M 806 568 C 960 640 1010 652 1128 652");animation-duration:2.2s;animation-delay:-1.6s;}
.uplink{fill:none;stroke:#1f4f66;stroke-width:1.6;stroke-dasharray:6 10;animation:dash 4s linear infinite;}
.geo-dot{fill:var(--green);filter:drop-shadow(0 0 6px rgba(43,255,136,.9));}
.sweep{
  transform-box:fill-box;transform-origin:center;
  animation:sweep 9s linear infinite;
  opacity:.32;
}
@keyframes sweep{to{transform:rotate(360deg);}}

/* ==========================================================================
   STATE 3 — DASHBOARD CLIP + PRICING
   ========================================================================== */
.screen{clip-path:url(#screenClip);}
/* "edit" of dataimpulseclip.mp4: hard punch-in cuts + slow drift, all on the
   master clock so the cuts land inside 0:25 – 0:35 */
.clip-move{
  transform-box:fill-box;transform-origin:center;
  animation:clipEdit var(--T) linear infinite;
}
@keyframes clipEdit{
  0%,55.56%    {transform:scale(1) translate(0,0);}
  61.11%       {transform:scale(1.06) translate(0,0);}
  61.111%      {transform:scale(1.34) translate(-70px,26px);}   /* CUT 1 */
  67.77%       {transform:scale(1.40) translate(-84px,20px);}
  67.778%      {transform:scale(1.62) translate(96px,-86px);}   /* CUT 2 */
  73.33%       {transform:scale(1.68) translate(104px,-92px);}
  73.334%      {transform:scale(1.10) translate(0,-10px);}      /* CUT 3 */
  77.78%,100%  {transform:scale(1.16) translate(0,-14px);}
}
.cut-flash{animation:cutFlash var(--T) linear infinite;opacity:0;}
@keyframes cutFlash{
  0%,61.05%{opacity:0;}
  61.15%   {opacity:.5;}
  61.6%    {opacity:0;}
  67.72%   {opacity:0;}
  67.82%   {opacity:.5;}
  68.3%    {opacity:0;}
  73.28%   {opacity:0;}
  73.38%   {opacity:.5;}
  73.9%    {opacity:0;}
  100%     {opacity:0;}
}
.clip-video{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  background:transparent;
  filter:contrast(1.06) saturate(1.12) brightness(1.03);
}
.scanline{animation:scan 5.5s linear infinite;}
.scrub-fill{transform-box:fill-box;transform-origin:left center;animation:scrub var(--T) linear infinite;}
@keyframes scrub{
  0%,55.56%   {transform:scaleX(0);}
  77.78%,100% {transform:scaleX(1);}
}
.bar-fill{transform-box:fill-box;transform-origin:left center;animation:barFill var(--T) linear infinite;}
@keyframes barFill{
  0%,58.9%   {transform:scaleX(0);}
  60%        {transform:scaleX(.08);}
  64.4%      {transform:scaleX(.42);}
  68.9%      {transform:scaleX(.68);}
  73.3%      {transform:scaleX(.9);}
  75.6%,100% {transform:scaleX(1);}
}

/* ==========================================================================
   STATE 4 — CTA
   ========================================================================== */
.bluewash{animation:bluewash var(--T) linear infinite;opacity:0;}
@keyframes bluewash{
  0%,76.7%    {opacity:0;}
  78.9%,98.6% {opacity:1;}
  100%        {opacity:0;}
}
.cta-card{animation:ctaGlow 2.4s ease-in-out infinite;}
@keyframes ctaGlow{
  0%,100%{stroke:#2f8dff;filter:drop-shadow(0 0 6px rgba(47,141,255,.35));}
  50%    {stroke:#6fd0ff;filter:drop-shadow(0 0 26px rgba(111,208,255,.75));}
}
/* 55 characters revealed one step at a time by widening the clip rect, with
   the block caret walking the same steps so it sits on the character typed */
.cta-type{animation:ctaType var(--T) steps(55) infinite;transform-box:fill-box;transform-origin:left center;}
#ctaClip rect{transform-box:fill-box;transform-origin:left center;}
@keyframes ctaType{
  0%,79.6%    {transform:scaleX(0);}
  86.7%,100%  {transform:scaleX(1);}
}
.cta-caret{animation:ctaCaret var(--T) steps(55) infinite;}
@keyframes ctaCaret{
  0%,79.6%    {transform:translateX(0);}
  86.7%,100%  {transform:translateX(1122px);}
}
.arrow-hint{animation:drift 1.6s ease-in-out infinite;}
.cta-ring{
  transform-box:fill-box;transform-origin:center;
  animation:ringOut 3s ease-out infinite;
}

/* ==========================================================================
   CAPTIONS
   ========================================================================== */
.caption{font-family:var(--sans);font-size:41px;font-weight:500;fill:#eaf1f8;letter-spacing:.004em;}
.caption .hl-g{fill:var(--green);font-weight:700;}
.caption .hl-c{fill:var(--cyan);font-weight:700;}
.caption .hl-r{fill:var(--red-2);font-weight:700;}
.caption .hl-a{fill:var(--amber);font-weight:700;}
.cap{animation-duration:var(--T);animation-timing-function:cubic-bezier(.2,.7,.3,1);animation-iteration-count:infinite;opacity:0;}
.cap-1{animation-name:capA;}
.cap-2{animation-name:capB;}
.cap-3{animation-name:capC;}
.cap-4{animation-name:capD;}
@keyframes capA{
  0%,21.11%   {opacity:1;transform:translateY(0);}
  22.22%      {opacity:0;transform:translateY(-10px);}
  98%         {opacity:0;transform:translateY(14px);}
  100%        {opacity:1;transform:translateY(0);}
}
@keyframes capB{
  0%,22.22%   {opacity:0;transform:translateY(14px);}
  23.55%      {opacity:1;transform:translateY(0);}
  54.45%      {opacity:1;transform:translateY(0);}
  55.56%,100% {opacity:0;transform:translateY(-10px);}
}
@keyframes capC{
  0%,55.56%   {opacity:0;transform:translateY(14px);}
  56.9%       {opacity:1;transform:translateY(0);}
  76.67%      {opacity:1;transform:translateY(0);}
  77.78%,100% {opacity:0;transform:translateY(-10px);}
}
@keyframes capD{
  0%,77.78%   {opacity:0;transform:translateY(14px);}
  79.11%      {opacity:1;transform:translateY(0);}
  98%         {opacity:1;transform:translateY(0);}
  100%        {opacity:0;transform:translateY(-10px);}
}
</style>
</head>
<body>
<main class="frame">
<svg class="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">DatImpulse residential proxy pipeline — 45 second animated explainer</title>
  <desc id="dsc">A four-state animation: blocked agent requests, a global residential IP network, the DatImpulse dashboard with pay-as-you-go pricing, and a closing call to action.</desc>

  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1119"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#061a3d"/>
      <stop offset="55%"  stop-color="#04122c"/>
      <stop offset="100%" stop-color="#020a1a"/>
    </linearGradient>
    <radialGradient id="gAlarm" cx="50%" cy="50%" r="72%">
      <stop offset="55%"  stop-color="#ff3b5c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff3b5c" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="gVig" cx="50%" cy="48%" r="72%">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="gGlobe" cx="38%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#123243"/>
      <stop offset="60%"  stop-color="#0a1a26"/>
      <stop offset="100%" stop-color="#060d14"/>
    </radialGradient>
    <radialGradient id="gCta" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#1b5fd0" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#1b5fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGreenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#12c46a"/>
      <stop offset="100%" stop-color="#2bff88"/>
    </linearGradient>
    <linearGradient id="gRedBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8c1226"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>
    <linearGradient id="gScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#35d6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#35d6ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#35d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2bff88" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#2bff88" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#141b26" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".025"/>
    </pattern>

    <clipPath id="globeClip"><circle cx="620" cy="470" r="250"/></clipPath>
    <clipPath id="screenClip"><rect x="140" y="228" width="980" height="552" rx="4"/></clipPath>
    <clipPath id="ctaClip"><rect class="cta-type" x="392" y="452" width="1130" height="70"/></clipPath>
  </defs>

  <!-- ===================== BACKDROP ===================== -->
  <rect width="1920" height="1080" fill="url(#gBg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".55"/>
  <rect class="bluewash" width="1920" height="1080" fill="url(#gBlue)"/>

  <!-- ===================== HUD ===================== -->
  <g>
    <text x="160" y="66" font-size="26" letter-spacing=".26em" class="b">DATAIMPULSE</text>
    <text x="418" y="66" font-size="26" letter-spacing=".26em" class="dim">// RESIDENTIAL PROXY PIPELINE</text>
    <circle cx="1418" cy="58" r="6" fill="#2bff88" class="pulse"/>
    <text x="1438" y="66" font-size="22" class="green track">LIVE</text>
    <g class="tc" text-anchor="end">
      <text class="cue cue-tick" style="--at:0s" x="1660" y="66">0:00</text>
      <text class="cue cue-tick" style="--at:1s" x="1660" y="66">0:01</text>
